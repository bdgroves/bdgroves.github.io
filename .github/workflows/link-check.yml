name: Link check
# Manual only: checks every outside link on the site and pushes a report to the link-report branch.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: |
          python tools/linkcheck/scan.py . /tmp/urls.json
          python tools/linkcheck/check.py /tmp/urls.json /tmp/report.md
      - name: Publish report to link-report branch
        run: |
          cd /tmp && rm -rf rep && mkdir rep && cd rep && git init -q -b link-report
          cp /tmp/report.md /tmp/urls.json .
          git -c user.name=link-check -c user.email=actions@github.com add . 
          git -c user.name=link-check -c user.email=actions@github.com commit -qm "link report $(date -u +%F)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" link-report
