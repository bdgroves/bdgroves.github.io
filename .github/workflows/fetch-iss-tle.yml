name: Fetch ISS orbit (TLE)

# Keeps radio/data/iss-tle.txt fresh for the live map and pass predictions
# on brooksgroves.com/radio/. The page reads this same-origin file first and
# only falls back to CelesTrak / wheretheiss.at from the browser if it's missing.
# The ISS orbit changes a little every day and after each reboost, so twice a day is plenty.

on:
  schedule:
    - cron: '17 5,17 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the ISS TLE from CelesTrak
        run: |
          mkdir -p radio/data
          curl -sfL --retry 3 --retry-delay 10 -A "brooksgroves.com ISS tracker (github.com/bdgroves)" \
            "https://celestrak.org/NORAD/elements/gp.php?CATNR=25544&FORMAT=TLE" -o /tmp/iss.txt
          # Sanity check: a name line plus lines starting "1 25544" and "2 25544".
          grep -q '^1 25544' /tmp/iss.txt && grep -q '^2 25544' /tmp/iss.txt
          tr -d '\r' < /tmp/iss.txt | sed 's/[[:space:]]*$//' > radio/data/iss-tle.txt
          cat radio/data/iss-tle.txt

      - name: Commit data
        run: |
          git config user.name  "github-actions"
          git config user.email "actions@github.com"
          git add radio/data/iss-tle.txt
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: ISS orbit $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase origin "$(git rev-parse --abbrev-ref HEAD)" && \
            git push && exit 0
            echo "Push retry $i…"
            sleep 5
          done
          echo "Failed to push after 3 retries"
          exit 1
