name: Fetch flag pictures

# Flag Atlas (/flags/): when a pack in flags/data/ lists a flag whose picture isn't saved yet,
# download it from Wikimedia Commons and commit it. The commit deploys the site as usual.
on:
  push:
    branches: [main]
    paths: ["flags/data/*.json", "flags/tools/fetch_flags.py"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-flags
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python flags/tools/fetch_flags.py
      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add flags/img
          git diff --cached --quiet || (git commit -m "chore: flag pictures fetched" && git pull --rebase -q && git push)
