name: Fetch Goodreads Books

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      republish:
        description: "Republish the site even if the shelf didn't change"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write   # to start the Pages deploy when the shelf changes

jobs:
  fetch-books:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch Goodreads RSS and generate books.json
        run: |
          python3 << 'EOF' 2>&1 | tee data/goodreads-last-run.log
          import json, time, urllib.error, urllib.request
          import xml.etree.ElementTree as ET

          USER_ID = "9579797"
          UAS = ["Mozilla/5.0 (compatible; brooksgroves-bot/1.0; +https://brooksgroves.com)",
                 "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"]

          def fetch_shelf(shelf):
              """The shelf's RSS, trying twice per user agent; raises with the reason if all fail."""
              url = f"https://www.goodreads.com/review/list_rss/{USER_ID}?shelf={shelf}"
              last = None
              for ua in UAS:
                  for attempt in range(2):
                      try:
                          req = urllib.request.Request(url, headers={"User-Agent": ua, "Accept": "application/rss+xml, application/xml;q=0.9, */*;q=0.8"})
                          with urllib.request.urlopen(req, timeout=20) as r:
                              body = r.read()
                          if b"<rss" not in body[:500]:
                              raise ValueError(f"not RSS: {body[:120]!r}")
                          return body
                      except urllib.error.HTTPError as e:
                          last = f"HTTP {e.code} {e.reason}"
                      except Exception as e:
                          last = f"{type(e).__name__}: {e}"
                      print(f"  {shelf}: {last} (ua {UAS.index(ua) + 1}, try {attempt + 1})")
                      time.sleep(5)
              raise RuntimeError(last)

          def parse_books(xml_data, limit):
              channel = ET.fromstring(xml_data).find("channel")
              books = []
              for item in channel.findall("item")[:limit]:
                  def tag(name):
                      el = item.find(name)
                      return el.text.strip() if el is not None and el.text else ""
                  books.append({
                      "title": tag("title"),
                      "author": tag("author_name"),
                      "image": tag("book_medium_image_url"),
                      "link": tag("link"),
                      "rating": tag("user_rating"),
                      "shelf": tag("user_shelves"),
                      "read_at": tag("user_read_at"),
                  })
              return books

          # Start from the last good copy, so a Goodreads hiccup never empties the Bookshelf.
          try:
              output = json.load(open("books.json"))
          except Exception:
              output = {}
          output.setdefault("currently_reading", [])
          output.setdefault("recently_read", [])

          for key, shelf, limit in (("currently_reading", "currently-reading", 3),
                                    ("recently_read", "read", 12)):   # the Bookshelf on Outside shows up to 12 books
              try:
                  books = parse_books(fetch_shelf(shelf), limit)
              except Exception as e:
                  print(f"{shelf}: failed ({e}); keeping the last {len(output[key])} books")
                  continue
              if not books and key == "recently_read" and output[key]:
                  print(f"{shelf}: Goodreads sent an empty list; keeping the last {len(output[key])} books")
                  continue
              output[key] = books
              print(f"{shelf}: {len(books)} books")

          with open("books.json", "w") as f:
              json.dump(output, f, indent=2)
          EOF

      - name: Commit books.json
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add books.json data/goodreads-last-run.log
          if git diff --staged --quiet -- books.json; then
            git diff --staged --quiet || { git commit -q -m "chore: goodreads run log [skip ci]"; for i in 1 2 3; do git pull -q --rebase origin main && git push -q && break; sleep 5; done; }
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: update books.json [skip ci]"
            for i in 1 2 3; do git pull -q --rebase origin main && git push -q && break; sleep 5; done
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # A push made by this workflow doesn't start other workflows (and the
      # [skip ci] keeps it from trying), so when the shelf changed, start the
      # Pages deploy directly; the Bookshelf on Outside is then current the
      # same morning.
      - name: Republish the site
        if: steps.commit.outputs.changed == 'true' || inputs.republish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run jekyll-gh-pages.yml --ref main --repo "${{ github.repository }}"
