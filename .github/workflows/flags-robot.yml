name: Flag robot

# Flag Atlas (/flags/). Every hour: rebuild the packs from Wikidata if they're a week old, download any
# flag pictures still missing (about 20 minutes' worth per run), check them for the place's name, mark
# what's ready, and schedule Flag of the Day three weeks ahead. Quiet runs change nothing and commit nothing.
on:
  schedule:
    - cron: "23 * * * *"
  push:
    branches: [main]
    paths: ["flags/tools/**", "flags/data/pnw.json", "flags/data/overrides.json"]
  workflow_dispatch:
    inputs:
      rebuild:
        description: "Rebuild the packs from Wikidata now"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: flags-robot
  cancel-in-progress: false

jobs:
  robot:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get install -y -qq tesseract-ocr >/dev/null && pip install -q pillow
      - name: Build packs
        continue-on-error: true      # if Wikidata is slow, keep last week's packs and still fetch pictures
        run: python flags/tools/build_packs.py ${{ (github.event_name == 'workflow_dispatch' && inputs.rebuild) && '--force' || '' }}
      - name: Build the deeper sets
        continue-on-error: true
        run: python flags/tools/build_deep.py ${{ (github.event_name == 'workflow_dispatch' && inputs.rebuild) && '--force' || '' }}
      - name: Download pictures
        run: python flags/tools/fetch_flags.py
      - name: Ready flags and Flag of the Day
        run: python flags/tools/finalize.py
      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add flags/data flags/img
          git diff --cached --quiet || (git commit -q -m "chore: flag robot" && git pull --rebase -q && git push)
