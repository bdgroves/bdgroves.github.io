name: Smoke monitors (one-off)

on:
  push:
    branches: [smoke-monitors]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-24.04
    if: "!contains(github.event.head_commit.message, '[data]')"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download AirNow hourly PM2.5 around Washington
        run: python tools/smoke-monitors/scripts/fetch_monitors.py
      - name: Save the readings to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f tools/smoke-monitors/data/monitors_pm25_*.csv tools/smoke-monitors/data/cache/airnow/sites.csv
          git commit -m "AirNow PM2.5 readings [data]"
          git push
