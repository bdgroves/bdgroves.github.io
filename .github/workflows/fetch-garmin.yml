name: Fetch Garmin Data

on:
  schedule:
    - cron: '0 8 * * *'   # 8am UTC daily — catches overnight activities
    # Two intraday refreshes (about 1pm and 7pm Pacific) so a same-day
    # workout reaches FuelCast before the evening, and the plan can refuel
    # for what was actually done rather than what was planned.
    - cron: '0 20 * * *'
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.66.0
          cache: true

      - name: Fetch Garmin data
        env:
          GARMIN_TOKENS_JSON: ${{ secrets.GARMIN_TOKENS_JSON }}
        run: pixi run fetch-garmin

      - name: Commit data
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          # Both outputs. fetch_garmin.py writes training.json (the site
          # dashboard) and training-load.json (the daily TSS series the
          # FuelCast repo reads). Staging only the first meant the second
          # was generated in the runner and discarded at job end — the
          # script logged that it had written the file, the workflow
          # succeeded, and the file never reached main.
          git add data/training.json data/training-load.json
          # Fail loudly if the script stopped producing one of them. A
          # missing file here would otherwise show up downstream as
          # FuelCast quietly falling back to a four-month-stale seed.
          for f in data/training.json data/training-load.json; do
            if [ ! -f "$f" ]; then
              echo "ERROR: $f was not written by fetch_garmin.py"
              exit 1
            fi
          done
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            for i in 1 2 3; do
              git commit -m "chore: garmin training data $(date -u +%Y-%m-%d)"
              git pull --rebase origin main
              if git push; then
                echo "Push succeeded"
                exit 0
              fi
              echo "Push attempt $i failed, retrying..."
              sleep $((i * 3))
            done
            echo "Push failed after retries"
            exit 1
          fi
