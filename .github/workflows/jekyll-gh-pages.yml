name: Deploy Jekyll with GitHub Pages dependencies preinstalled

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Canonical tags and sitemap
        # Adds <link rel="canonical"> to any new page and rebuilds sitemap.xml
        # (see scripts/seo.py). Only changes the deployed copy, not the repo.
        run: python3 scripts/seo.py
      - name: Footer script for the project sites
        # Rebuilds js/site-footer.js from tags.html's footer and css/site-footer.css.
        run: python3 scripts/build_footer_js.py
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Search index (Pagefind)
        # Builds the site search that /search/ uses into _site/pagefind/.
        # The project sites (Mother Lode, secchi, PELE...) live in their own
        # repos, so scripts/crawl_projects.py fetches their published pages
        # into a staging copy first and they are indexed with the right URLs;
        # only the index is deployed. Menus, footers, the Keep-reading cards
        # and the Contents box are left out so results match the page's own
        # words. Games and the old hightimes-db pages aren't in the globs.
        run: |
          sudo chown -R "$(id -u):$(id -g)" _site
          mkdir -p "$RUNNER_TEMP/search-stage"
          cp -r _site/. "$RUNNER_TEMP/search-stage/"
          PROJECTS=$(python3 scripts/crawl_projects.py "$RUNNER_TEMP/search-stage" || true)
          npx -y pagefind@1.3.0 --site "$RUNNER_TEMP/search-stage" --output-path _site/pagefind \
            --glob "{*.html,blog/*.html,topics/**/*.html,work/*.html,live/*.html,writing/*.html,learning/**/*.html,recipes/*.html${PROJECTS:+,$PROJECTS}}" \
            --exclude-selectors "header, nav, footer, .keep-reading, .post-toc, .topline, .weather-bar, .mobile-nav, .jump-bar, .lead-controls, script, style"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
