const N = Object.fromEntries(NODES.map(n=>[n.id,n]));
const ADJ = {};
NODES.forEach(n=> ADJ[n.id]=[]);

/* ---------------- GEO ---------------- */
function metres(a,b){
  const R=6371000, rad=d=>d*Math.PI/180;
  const dp=rad(b.lat-a.lat), dl=rad(b.lon-a.lon);
  const x=Math.sin(dp/2)**2 + Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dl/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));
}
function km(a,b){ return metres(N[a],N[b])/1000; }
// Hours on foot, terrain-weighted, with a climb penalty (Naismith-ish).
function hours(a,b){
  const d = km(a,b);
  const pace = (TERRAIN[N[a].t].pace + TERRAIN[N[b].t].pace)/2;
  const climb = Math.max(0, N[b].el - N[a].el);
  return d/pace + climb/600;
}
function bearing(a,b){
  const rad=d=>d*Math.PI/180, deg=r=>r*180/Math.PI;
  const φ1=rad(N[a].lat), φ2=rad(N[b].lat), Δλ=rad(N[b].lon-N[a].lon);
  const y=Math.sin(Δλ)*Math.cos(φ2);
  const x=Math.cos(φ1)*Math.sin(φ2)-Math.sin(φ1)*Math.cos(φ2)*Math.cos(Δλ);
  return (deg(Math.atan2(y,x))+360)%360;
}
function compass(deg){
  const pts=['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
  return pts[Math.round(deg/22.5)%16];
}



/* ---------------- THE DAY ----------------
   Railroad Valley in summer. Cold at dawn, murderous by late
   afternoon, and the difference decides everything you do.     */
function tempAt(h){
  const x = ((h % 24) - 4) / 24 * Math.PI * 2;
  return Math.round(26 - 12 * Math.cos(x));      // ~14C at 04:00, ~38C at 16:00
}
function temp(){ return tempAt(player.clock); }
function clockStr(h){
  const t = ((h % 24) + 24) % 24;
  const hh = Math.floor(t), mm = Math.floor((t - hh) * 60);
  return String(hh).padStart(2,'0') + ':' + String(mm).padStart(2,'0');
}
function isNight(h){ const t=(h%24+24)%24; return t < 5.5 || t >= 20.0; }
function lightWord(){
  const t = (player.clock % 24 + 24) % 24;
  if(t < 4.5)  return 'dark';
  if(t < 6.0)  return 'first grey';
  if(t < 8.0)  return 'early light';
  if(t < 11.0) return 'morning';
  if(t < 15.0) return 'high sun';
  if(t < 18.5) return 'late heat';
  if(t < 20.0) return 'evening';
  return 'dark';
}

/* Litres per hour. Heat drives everything. */
function drinkRate(activity){
  const T = temp();
  const over = Math.max(0, T - 20);
  if(activity === 'walk')  return 0.40 + over * 0.055;
  if(activity === 'shade') return 0.10 + over * 0.016;
  return 0.14 + over * 0.034;                        // resting in the open
}
function heatGain(activity){
  const T = temp();
  if(activity === 'walk')  return Math.max(-6, (T - 30) * 1.7);
  if(activity === 'shade') return Math.min(0, (T - 34) * 0.5) - 5;
  return (T - 33) * 0.6 - 1;
}

function advance(h, activity){
  player.clock += h;
  while(player.clock >= 24){ player.clock -= 24; player.day += 1; }
  const need = drinkRate(activity) * h;
  const short = Math.max(0, need - player.water);
  player.water = Math.max(0, player.water - need);
  if(player.water <= 0){
    // Once you are out, heat and effort decide how fast this goes.
    const T = temp();
    const load = (activity === 'walk' ? 1.7 : activity === 'shade' ? 0.75 : 1.0);
    const heat = 1 + Math.max(0, T - 24) / 22;
    player.dry += (short > 0 ? h : h) * load * heat;
  }
  player.core  = Math.max(0, Math.min(100, player.core + heatGain(activity) * h));
  if(player.bitten) player.core = Math.min(100, player.core + h * 1.1);
  if(player.sick)   player.water = Math.max(0, player.water - h * 0.06 * player.sick);
  if(activity === 'walk'){
    // dehydration makes everything worse, including your feet
    const dry = player.water < 2 ? 1.5 : 1;
    player.feet = Math.min(100, player.feet + h * 2.2 * (player.bitten?1.3:1) * dry);
  } else {
    player.feet = Math.max(0, player.feet - h * 1.4);
  }
  // Nobody starts looking on day one, and if nobody is expecting
  // you, nobody starts looking at all.
  if(player.day >= 2){
    player.searchHeat += h * (player.day >= 3 ? 1.6 : 0.7) * RUN.expected.rate;
  }
  Engine.refreshStatus();
}

/* How wrong things are, in one number. Drives the prose. */
function strain(){
  // Below ~9 L you are on a budget; at zero the clock is player.dry,
  // which is what actually kills you.
  const thirst = player.water <= 0
    ? 70 + Math.min(30, player.dry / 9 * 30)
    : Math.max(0, 70 - player.water/9*70);
  return Math.round(Math.min(100, Math.max(thirst, player.core*0.85, player.feet*0.55)));
}
function condition(){
  const s = strain();
  if(player.water <= 0) return 'critical';
  if(s >= 75) return 'bad';
  if(s >= 50) return 'poor';
  if(s >= 25) return 'worn';
  return 'ok';
}

/* Walking gets slower as you fall apart. */
function paceFactor(){
  let f = 1;
  if(player.feet > 55) f *= 0.82;
  if(player.feet > 80) f *= 0.78;
  if(player.core > 60) f *= 0.85;
  if(player.water < 2) f *= 0.85;
  return f;
}

/* ---------------- SEEING ----------------
   On a flat valley floor you can see almost nothing. From high
   ground you can see a very long way, and the only things worth
   seeing at that range are tall: a windmill, a headframe, masts.
   This is how you actually navigate that country.               */
function seeingRange(){
  const here = N[player.at];
  if(here.t === 'ridge') return 22;      // km, from a knob or saddle
  if(here.el >= 1900)    return 18;
  if(here.t === 'playa') return 6;       // dead flat, heat shimmer
  return 9;
}
function spotFrom(){
  const range = seeingRange();
  const found = [];
  NODES.forEach(n=>{
    if(n.id === player.at) return;
    if(player.visited[n.id] || player.spotted[n.id]) return;
    if(!n.tall) return;                                   // only tall things carry
    if(km(player.at, n.id) > range) return;
    player.spotted[n.id] = true;
    found.push(n);
  });
  return found;
}
function spotLine(found){
  if(!found.length) return '';
  return '<div class="spotted"><b>From here you can see:</b><br>' +
    found.map(n=> n.name + ' \u2014 ' + km(player.at,n.id).toFixed(1) + ' km ' +
      compass(bearing(player.at,n.id)) + tell(n.id)).join('<br>') +
    '</div>';
}

/* What a landmark tells you about itself at distance. A windmill
   that is turning has wind and a connected pump. One that is
   standing dead still on a breezy afternoon does not. */
function tell(id){
  const src = RUN.water[id];
  if(id === 'mill_s' || id === 'mill_n'){
    if(src) return ' \u2014 <b>the head is turning</b>';
    return ' \u2014 <b>standing dead still</b>';
  }
  if(id === 'calib')     return ' \u2014 masts and a solar array';
  if(id === 'headframe') return ' \u2014 collapsed, nothing standing';
  return '';
}


/* You know a place if you have been there, or seen it from high
   ground. Otherwise you know a direction and the look of the
   ground, and nothing whatsoever about how far it runs.          */
function knows(id){ return !!player.visited[id] || !!player.spotted[id]; }
function vagueDistance(d){
  if(d < 5)  return 'not far';
  if(d < 10) return 'a fair way';
  if(d < 16) return 'a long way';
  return 'no telling how far';
}

/* ---------------- WATER IN THE GROUND ----------------
   Every source is a question, and the answer changes per trip. */
function rollWater(){
  const r = ()=> Math.random();
  return {
    mill_s:  r() < 0.75 ? {L: 4 + Math.random()*6,  foul:true }  : null,
    mill_n:  r() < 0.15 ? {L: 1 + Math.random()*2,  foul:true }  : null,
    trough:  r() < 0.60 ? {L: 3 + Math.random()*5,  foul:true }  : null,
    tank_e:  r() < 0.45 ? {L: 5 + Math.random()*8,  foul:false } : null,
    well:    r() < 0.50 ? {L: 6 + Math.random()*10, foul:false } : null,
    spring_w:r() < 0.55 ? {L: 2 + Math.random()*3,  foul:false } : null
  };
}
function sourceHere(){ return RUN.water[player.at] !== undefined; }

  };

/* ---------------- MAP ---------------- */
let map=null, markers={}, lines=[], hereRing=null, mapOK=false;

function buildMap(el){
  el.innerHTML = '<div id="map"></div>' +
    '<div class="maplegend">' +
      Object.keys(TERRAIN).map(k=>
        '<span><i style="background:'+TERRAIN[k].color+'"></i>'+TERRAIN[k].label+'</span>').join('') +
    '</div>';

  if(typeof L === 'undefined'){
    document.getElementById('map').outerHTML =
      '<div class="nomap">The map could not load.<br>Everything still works \u2014 you can travel from the list below.</div>';
    return;
  }
  mapOK = true;

  map = L.map('map', { zoomControl:true, attributionControl:true })
         .setView([38.34,-115.72], 10);

  L.tileLayer('https://basemap.nationalmap.gov/arcgis/rest/services/USGSTopo/MapServer/tile/{z}/{y}/{x}', {
    maxZoom:16, minZoom:8,
    attribution:'USGS The National Map'
  }).addTo(map);

  // edges as faint lines
  EDGES.forEach(([a,b])=>{
    lines.push(L.polyline([[N[a].lat,N[a].lon],[N[b].lat,N[b].lon]],
      { color:'#7a7268', weight:1, opacity:0.35, dashArray:'3,5' }).addTo(map));
  });

  NODES.forEach(n=>{
    const m = L.circleMarker([n.lat,n.lon], {
      radius:6, color:'#1c1a16', weight:1,
      fillColor:TERRAIN[n.t].color, fillOpacity:0.9
    }).addTo(map);
    m.on('click', ()=> onMarkerClick(n.id));
    markers[n.id] = m;
  });

  hereRing = L.circleMarker([N.jeep.lat,N.jeep.lon],
    { radius:13, color:'#8b3a2a', weight:2, fill:false }).addTo(map);
}

function refreshMap(){
  if(!mapOK || !player) return;
  const here = player.at;
  const near = ADJ[here] || [];
  NODES.forEach(n=>{
    const m = markers[n.id];
    if(!m) return;
    const isHere = n.id===here;
    const isNear = near.indexOf(n.id)!==-1;
    const seen   = !!player.visited[n.id];
    const spot   = !!player.spotted[n.id];
    m.setStyle({
      radius: isHere?8 : isNear?7 : 5,
      fillOpacity: isHere?1 : isNear?0.9 : (seen?0.6 : spot?0.5 : 0.18),
      color: isNear ? '#8b3a2a' : '#1c1a16',
      weight: isNear ? 2 : 1
    });
    const label = (seen||isNear||spot) ? n.name : 'Unvisited ground';
    const dist  = isNear ? '<br>' + km(here,n.id).toFixed(1) + ' km ' + compass(bearing(here,n.id)) +
                           ' \u00b7 ~' + hours(here,n.id).toFixed(1) + ' h on foot' : '';
    m.bindPopup('<b>' + label + '</b><br>' + TERRAIN[n.t].label + ' \u00b7 ' + n.el + ' m' + dist +
                (isNear ? '<br><i>Click again to walk here.</i>' : ''));
  });
  hereRing.setLatLng([N[here].lat, N[here].lon]);
  map.panTo([N[here].lat, N[here].lon], {animate:true});
}

let armed = null;
function onMarkerClick(id){
  if(!player) return;
  if(id === player.at) return;
  if((ADJ[player.at]||[]).indexOf(id) === -1) return;
  if(armed === id){ armed=null; travelTo(id); }
  else { armed = id; }
}

/* ---------------- BEING FOUND ----------------
   The whole argument of the game lives in these numbers.
   Search and rescue finds vehicles. It does not find people.  */
function shadeHere(){
  const t = N[player.at].t;
  if(player.at === 'jeep') return 'good';          // the vehicle itself
  if(t === 'mine' || t === 'ruin') return 'good';
  if(t === 'wash' || t === 'ridge') return 'some'; // a cutbank, a boulder
  return 'none';                                   // playa, bajada: nothing
}
function rescueChancePerHour(){
  const id = player.at;
  const n = N[id];
  // A parked vehicle is a target an aircraft can actually see.
  if(id === 'jeep'){
    return Math.min(0.20, player.searchHeat * 0.0045);
  }
  // Roads depend on traffic, not on anyone looking for you.
  if(n.t === 'road'){
    if(id === 'us6')    return 0.34;
    if(id === 'graded') return 0.055;
    return 0.010;                                   // two-tracks
  }
  // Out in the country, essentially nobody \u2014 unless a search is
  // running and you told them which way you went.
  const base = 0.0008 + Math.min(0.006, player.searchHeat * 0.00012);
  return player.note ? base * 3.2 : base;
}
function rescueLabel(){
  const p = rescueChancePerHour();
  if(p >= 0.25) return 'good';
  if(p >= 0.05) return 'fair';
  if(p >= 0.012) return 'poor';
  if(p >= 0.004) return 'faint';
  return 'none';
}
function rollRescue(hours){
  const p = rescueChancePerHour();
  const miss = Math.pow(1 - p, hours);
  return Math.random() > miss;
}

/* ---------------- REST ---------------- */
function restFor(h, mode){
  const shade = (mode === 'shade');
  player.shaded = shade;
  const before = player.day;
  advance(h, shade ? 'shade' : 'rest');
  const found = rollRescue(h);
  Engine.log('Waited ' + h + ' h' + (shade?' in shade':'') + ' \u2014 ' +
             clockStr(player.clock) + ', ' + temp() + '\u00b0C, ' +
             player.water.toFixed(1) + ' L left.', 'l-info');
  if(checkDead()) return;
  if(found) return Engine.go(()=>rescued(mode));
  Engine.go(arrive);
}

function checkDead(){
  if(player.core >= 100){ player.dead='heat';   Engine.go(()=>ending()); return true; }
  if(player.dry  >= 9)  { player.dead='thirst'; Engine.go(()=>ending()); return true; }
  return false;
}

/* ============================================================
   THE OTHER SITUATION
   Water and the Jeep are one problem. This is a different one,
   running underneath it, and the pieces connect if you find
   enough of them. Nothing here is ever confirmed. Everything
   has a reading that is completely ordinary, and the person
   doing the reading has not had water since yesterday.
   ============================================================ */

/* Threads you have picked up. Some unlock others. */
function found(t){ return player.threads.indexOf(t) !== -1; }
function pickUp(t){
  if(found(t)) return false;
  player.threads.push(t);
  player.anomaly += 1;
  Engine.log('\u25c8 ' + THREADS[t], 'l-info');
  Engine.refreshStatus();
  return true;
}
const THREADS = {
  log:      "Read the logbook in the cairn",
  freq:     "A frequency written in the back of a logbook",
  coords:   "Coordinates written beside it",
  sensor:   "Dug up whatever is buried on the playa",
  serial:   "A serial number, and the format it is in",
  plaque:   "Read the plaque at the calibration site",
  assembly: "Found what somebody built in the adit",
  carrier:  "Heard 1530 do something other than nothing",
  digits:   "Copied a position off the gap in the carrier",
  truck:    "Found the vehicle that position belongs to",
  camera:   "R.H.'s camera, and what was still in it",
  below:    "Went down the shaft, and saw who else works down there"
};

/* How unreliable the narrator currently is. Heat and thirst do
   this. It is not a metaphor and it is not the supernatural. */
function lucidity(){
  let l = 100;
  if(player.water < 4) l -= (4 - player.water) * 9;
  if(player.water <= 0) l -= 25;
  l -= player.core * 0.35;
  l -= Math.min(20, player.dry * 2.5);
  if(player.bitten) l -= 10;
  return Math.max(0, Math.round(l));
}
/* Pick a description appropriate to how much you can trust yourself.
   plain = you are fine. thin = something is a little off.
   gone = you are in no condition to be a witness to anything. */
function seen(plain, thin, gone){
  const L = lucidity();
  if(L > 70) return plain;
  if(L > 40) return thin;
  return gone;
}

/* ---------------- THE CAIRN ----------------
   Forty-one entries. Twenty-six of them are one man, and the
   log is the only place his story exists. Read in passes so it
   accumulates instead of arriving all at once.                */
const LOGBOOK = [
  { id:'log1', label:'THE EARLY ENTRIES \u00b7 1999\u20132000', thread:'log',
    plain:
      "<i>04/1999 \u2014 FTF! Long drive for a small can. Beautiful spot. Left a compass, took nothing. \u2014 R.H.</i><br><br>" +
      "<i>09/1999 \u2014 Second visit. Brought my daughter. She found it before I did and will not let this go. \u2014 R.H.</i><br><br>" +
      "<i>03/2000 \u2014 Antelope on the playa at first light, maybe forty head. Worth the trip on its own.</i><br><br>" +
      "<i>11/2000 \u2014 Cold. Ran the fence line on the way in for something to do. Somebody has been out here with a trencher.</i>",
    thin:
      "<i>FTF! Long drive for a small can.</i> \u2026 <i>Brought my daughter. She found it before I did.</i> \u2026 " +
      "<i>Somebody has been out here with a trencher.</i><br><br>You have to hold the book at arm's length to focus on it, which is new.",
    gone:
      "Ordinary entries. A man, a daughter, antelope, weather. The last one on this page says something about a trencher and you read it four times." },

  { id:'log2', label:'THE MIDDLE ENTRIES \u00b7 2001\u20132002', thread:'freq',
    plain:
      "<i>02/2001 \u2014 Followed the trench line 2.6km. It does not go to the site. It goes past it, parallel, on this side.</i><br><br>" +

function cacheScene(){

  Engine.render(
    (!opened
      ? '<div class="hereNote">A .30 cal ammo can, painted flat brown, wedged under the cairn with the lid gasket still good. ' +
        'Inside: a logbook in a freezer bag, a golf pencil worn to a stub, four AA batteries, a plastic army man, ' +
        'a Nevada quarter, and a laminated card explaining the game to whoever found it by accident.</div>' +
        '<div class="story">Forty-one entries. The first is dated 1999. <b>The last is dated 2003.</b> ' +
        'Nobody has signed it in twenty-three years.</div>' +
        '<div class="thought">Twenty-six of the forty-one are the same handwriting. R.H., whoever that was, kept coming back out here for four years and then stopped.</div>'

    '<div class="choices">' +
      unread.map(p => '<button class="choice" data-page="' + p.id + '"><span class="tag">' + p.label +

      '<button class="choice" id="k3"><span class="tag">PUT THE ROCKS BACK</span></button>' +
    '</div>'
  );
  document.querySelectorAll('#main .choice[data-page]').forEach(btn=>{
    btn.onclick = ()=>{

        '<div class="story"><b>' + p.label + '</b></div>' +
        '<div class="hereNote">' + seen(p.plain, p.thin, p.gone) + '</div>' +

          ? '<div class="thought">He was going back out in September. The book stops in August.</div>'
          : '') +

  });

      '<div class="thought">A headlamp with two working cells is a different tool than a headlamp with none. It is not much. It is more than nothing, which is the standing theme out here.</div>' +
      Engine.contBtn());

  };
  document.getElementById('k3').onclick = ()=> Engine.go(arrive);
}

  if(!rep) player.threads.push('boundary');
  Engine.render(
    '<div class="hereNote">Orange and white sign, bolted to a steel post, weathered but perfectly legible:<br>' +
    '<b>WARNING \u2014 RESTRICTED AREA. PHOTOGRAPHY PROHIBITED. USE OF DEADLY FORCE AUTHORIZED.</b></div>' +
    '<div class="story">Behind it, three strands of barbed wire on cedar posts, forty years old, sagging. ' +
    'You could step over it in a second and a half without touching it.</div>' +
    '<div class="thought">The fence is not the security. The fence is a courtesy so that nobody can say they did not know. The security is something else and it is not visible from here.</div>' +
    (found('sensor') ? '<div class="hereNote">' + seen(
        'The conduit you dug up runs this direction. Not toward the fence exactly. Parallel to it, a few hundred metres out, on your side.',
        'The buried line runs parallel to this fence. On your side of it. You have thought about that for longer than is useful.',
        'It runs along the fence. On this side. On your side. You keep saying that phrase to yourself and it keeps sounding like it means something.'
      ) + '</div>' : '') +
    Engine.contBtn()
  );
  Engine.wire(arrive);
}

/* ---------------- THE RADIO ----------------
   After dark the ionosphere lifts and the AM band fills up with
   places you are not. It costs battery. So does the starter.    */
const BANDS = [
  { khz:640, call:"KFI", city:"Los Angeles",
    night:["A traffic report. Southbound 405 is stacked to the airport and a caller is furious about it. It is 2 a.m. and somebody in Los Angeles is furious about the 405.",
           "Ads for a mattress warehouse in Torrance, delivered with tremendous urgency, to you, here."],
    day:null },
  { khz:1160, call:"KSL", city:"Salt Lake City",
    night:["Regional forecast. Moisture pushing up out of Arizona, thunderstorms possible over the eastern Nevada ranges tomorrow afternoon.",
           "Forecast: high pressure, clear, no precipitation anywhere in the Great Basin for five days."],
    day:null },
  { khz:720, call:"KDWN", city:"Las Vegas",
    night:["Cattle prices, then a county road advisory for Nye and Lincoln. Nothing about a Jeep. Nobody has reported you yet, or nobody has told the radio.",
           "A swap-meet show. A man is trying to sell a horse trailer to nobody at all."],
    day:null },
  { khz:1070, call:"KNX", city:"Los Angeles",
    night:["News on the hour, fading up and down like someone is turning a dial that is not your dial.",
           "It comes in for eleven seconds at a time and goes out for thirty. You listen to eleven-second pieces of the world."],
    day:null },
  { khz:1200, call:"\u2014", city:"nowhere in particular",
    night:["A man is taking calls about lights over Nye County. The caller describes a ridge. You are looking at that ridge.",
           "Somebody is explaining, patiently and at length, what the government has out here. He is wrong about most of it and right about the fence."],
    day:null },
  { khz:1530, call:"", city:"", odd:true,
    night:["A carrier. No modulation, no station identification, no programme. Just something transmitting on 1530 and saying nothing at all.",
           "Still there. Same frequency, same nothing. It was there last night too, if you were listening last night."],
    day:null }
];


/* 1530 is a carrier and nothing else, until you have found enough
   for your own head to start doing the work. */
function carrierLine(){
  const n = player.anomaly;
  if(!found('freq')){
    // You can get there without the logbook. It just takes sitting
    // with it, which is the one thing staying at the Jeep gives you.
    player.carrierHits = (player.carrierHits || 0) + 1;
    if(player.carrierHits === 1)
      return "A carrier. No modulation, no station identification, no programme. Something is transmitting on 1530 and saying nothing at all.";
    if(player.carrierHits === 2)
      return "Still there. Same frequency, same nothing. You leave it running while you do other things and it does not go away.";
    if(player.carrierHits === 3)
      return seen(
        "Third night. You start timing it, because there is nothing else to do with a battery and a dial. It runs about four minutes, drops out for a few seconds, and comes back.",
        "You have started timing it. Four minutes, a gap, four minutes. You are aware that timing a carrier is not a normal way to spend a night.",
        "You time it. You have been timing it. You could not say for how long."
      );
    pickUp('freq');
    return seen(
      "Eleven seconds. The gap is eleven seconds, every four minutes, and you have it twice running now. Nothing that is not a machine keeps time like that.",
      "Eleven seconds, four minutes, eleven seconds. You have it twice and you wanted it both times, and you know what that is worth.",
      "Eleven. Four. Eleven. You have written it on the inside of the door with a pen that is running out."
    );
  }
  if(n <= 2) return seen(
    "The frequency from the logbook. It is exactly what he said it was \u2014 on all night, and not a station. A carrier with nothing on it. Somebody wrote that down in 2003 and somebody is still transmitting it.",
    "1530. On all night, not a station, exactly as written. Twenty-three years later. You sit with the key on longer than you meant to.",
    "1530 all night now. Not a station. You are reading a dead man's handwriting off the inside of your own eyelids and the carrier is still there."
  );
  if(n <= 4) return seen(
    "The carrier holds steady for four minutes, then drops out for eleven seconds, then comes back. You wait. Four minutes. Eleven seconds. Four minutes.",
    "It goes away for eleven seconds every four minutes. You have timed it twice and got eleven both times, and you are aware that you wanted it to be eleven both times.",
    "Four minutes and then a gap. You have been counting the gaps instead of sleeping and you could not say for how long."
  );
  if(n <= 6) return seen(
    "Under the carrier, very low, there is structure \u2014 a fast repeating tone pattern, the sound a modem makes. It is not talking to you. It is not talking to anybody who listens on this band.",
    "There is something under the carrier. Fast, regular, machine. You know what data sounds like and this sounds like data, and you also know what your own head sounds like at this point.",
    "There is something under it and you cannot tell any more whether the something is in the radio."
  );
  if(!found('digits')){
    pickUp('digits');
    unlockTruck();
    return seen(
      "Four minutes, eleven seconds of nothing, and in the gap tonight \u2014 once, clearly, in the clear \u2014 a woman's voice reading a string of digits. " +
      "Six of them, then six more, then the carrier again.<br><br>You write them down before you have finished deciding whether you heard them. " +
      "Then you sit looking at what you have written, because a number in that format is not a number. It is a place. " +
      "It is about eleven kilometres west of here, out on the bajada under the Pancakes, and there is nothing there.",
      "Digits in the gap. Six and six. You write them down and then you look at what you have written and understand the format, and it is a position, " +
      "and it is west, under the Pancakes, where there is nothing.",
      "There were numbers and you wrote them on your hand and the hand says a place. West. You do not remember deciding to write it."
    );
  }
  return seen(
    "The carrier, the gap, the carrier. No voice tonight. You wait through six cycles to be sure.",
    "No voice tonight. You wait anyway, longer than you should, with a battery you cannot spare.",
    "Nothing tonight. You keep the key on regardless."
  );
}

/* The one thing the strange track gives you that you can walk to. */
function unlockTruck(){
  if(player.spotted['truck']) return;
  player.spotted['truck'] = true;
  Engine.log('A position, west under the Pancakes.', 'l-info');
}

function radioScene(){
  Engine.badge('THE RADIO');
  const night = isNight(player.clock);
  const skip = night ? 'The band is wide open.' : 'Daylight. The band is dead \u2014 nothing but local static until the sun goes down.';
  Engine.render(
    '<div class="hereNote">Key on, engine off. Battery at <b>' + Math.round(player.battery) + '%</b>. ' +
    'Every minute of this is a minute of starter motor you do not get back.</div>' +
    '<div class="story">' + skip + '</div>' +
    (night ? '<div class="thought">Skywave. After dark the D layer thins out and the medium wave band stops being local and starts being continental. Six hundred miles is nothing at 2 a.m.</div>' : '') +
    '<div class="choices">' +
      (night ? BANDS.map((b,i)=>
        '<button class="choice" data-b="' + i + '"><span class="tag">' + b.khz + ' kHz' +
        (b.call ? ' \u00b7 ' + b.call + ', ' + b.city : '') + '</span>Tune it. \u22124% battery, 30 minutes.</button>').join('')
        : '<button class="choice" id="rx"><span class="tag">SCAN ANYWAY \u00b7 \u22124%</span>Hiss, and the sound of your own alternator not charging.</button>') +
      '<button class="choice" id="rq"><span class="tag">KEY OFF</span>Save what is left.</button>' +
    '</div>'
  );
  document.querySelectorAll('#main .choice[data-b]').forEach(btn=>{
    btn.onclick = ()=>{
      const b = BANDS[+btn.dataset.b];
      player.battery = Math.max(0, player.battery - 4);
      advance(0.5, 'shade');
      Engine.sfxTick();
      let line = Engine.pick(b.night);
      if(b.odd) line = carrierLine();
      Engine.log('Tuned ' + b.khz + ' kHz.', 'l-info');
      if(b.odd && found('freq') && player.anomaly >= 3) pickUp('carrier');
      Engine.refreshStatus();
      if(checkDead()) return;
      Engine.render(
        '<div class="story"><b>' + b.khz + ' kHz</b>' + (b.call ? ' \u2014 ' + b.call + ', ' + b.city : '') + '</div>' +
        '<div class="hereNote">' + line + '</div>' +
        '<div class="thought">Half an hour gone. Four percent gone. It was worth it, and you will have to decide later whether that is true.</div>' +
        Engine.contBtn()
      );
      Engine.wire(radioScene);
    };
  });
  if(document.getElementById('rx')) document.getElementById('rx').onclick = ()=>{
    player.battery = Math.max(0, player.battery - 4);
    advance(0.5,'shade');
    Engine.refreshStatus();
    if(checkDead()) return;
    Engine.render('<div class="story">Static, and one station in Ely so faint it is more an idea than a signal.</div>' + Engine.contBtn());
    Engine.wire(radioScene);
  };
  document.getElementById('rq').onclick = ()=> Engine.go(jeepScene);
}

/* ---------------- THE JEEP ---------------- */
function jeepScene(){
  Engine.badge('THE JEEP');
  const F = FAULTS[RUN.fault];
  const diag = player.diagnosed;
  Engine.render(
    '<div class="hereNote">Hood up. Everything you own is in the back and none of it starts an engine.</div>' +
    (diag ? '<div class="story">It is the <b>' + F.name + '</b>. ' + F.clue + '</div>' : '') +
    '<div class="choices">' +
      (!diag ? '<button class="choice" id="j1"><span class="tag">WORK OUT WHAT IS WRONG \u00b7 1 h</span>Systematically, in the heat, with the tools you have.' + odds(10,'MECHANICAL',8) + '</button>' : '') +
      (diag && F.fixable && !player.fixed ? '<button class="choice" id="j2"><span class="tag">FIX IT \u00b7 2 h</span>' + F.name + '. You have a shot at this.' + odds(10,'MECHANICAL',F.dc) + '</button>' : '') +
      (diag && !F.fixable ? '<button class="choice" id="j3"><span class="tag">TRY ANYWAY \u00b7 2 h</span>You already know how this ends. Two hours and some water to prove it.</button>' : '') +
      (player.fixed ? '<button class="choice" id="j4"><span class="tag">DRIVE OUT</span>Turn the key and go.</button>' : '') +
      '<button class="choice" id="j5"><span class="tag">THE RADIO \u00b7 1 h</span>Battery at ' + Math.round(player.battery) + '%. It is also what turns the starter.</button>' +
      '<button class="choice" id="j6"><span class="tag">BACK</span>Leave it for now.</button>' +
    '</div>'
  );
  const B = id => document.getElementById(id);
  if(B('j1')) B('j1').onclick = ()=>{
    advance(1,'rest');
    if(checkDead()) return;
    Engine.check({die:10, mod:mod('MECHANICAL'), dc:8, label:'Diagnose (MECHANICAL)'}, (ok)=>{
      if(ok){
        player.diagnosed = true;
        Engine.log('Diagnosed: ' + F.name, 'l-good');
        Engine.render('<div class="story">' + F.clue + ' It is the <b>' + F.name + '</b>.</div>' +
          (F.fixable ? '<div class="thought">Which you might be able to do something about.</div>'
                     : '<div class="thought">Which you cannot do anything about out here, with these tools, at all. Knowing that is worth something. It is worth not spending tomorrow finding out.</div>') +
          Engine.contBtn());
      } else {
        Engine.render('<div class="story">An hour bent over a hot engine and you are no wiser. Something electrical, or something fuel, or something you cannot see.</div>' + Engine.contBtn());
      }
      Engine.wire(jeepScene);
    });
  };
  if(B('j2')) B('j2').onclick = ()=>{
    advance(2,'rest');
    if(checkDead()) return;
    Engine.check({die:10, mod:mod('MECHANICAL'), dc:F.dc, label:'Repair (MECHANICAL)'}, (ok)=>{
      if(ok){
        player.fixed = true;
        Engine.sfxSuccess();
        Engine.log('Repair successful: ' + F.name, 'l-good');
        Engine.render('<div class="story">' + F.fix + '</div>' + Engine.contBtn());
      } else {
        Engine.render('<div class="story">Two hours, a lot of sweat, and it still will not catch. You can try again. The water you spent is not coming back.</div>' + Engine.contBtn());
      }
      Engine.wire(jeepScene);
    });
  };
  if(B('j3')) B('j3').onclick = ()=>{
    advance(2,'rest');
    if(checkDead()) return;
    player.battery -= 12;
    Engine.render('<div class="story">Two hours confirming what you already knew, and twelve percent of a battery you are going to want later.</div>' + Engine.contBtn());
    Engine.wire(jeepScene);
  };
  if(B('j4')) B('j4').onclick = ()=>{
    if(player.battery < 20){
      Engine.render('<div class="story">It is fixed and the battery is flat. You spent it on the radio. That is a specific kind of joke to be the punchline of.</div>' + Engine.contBtn());
      return Engine.wire(jeepScene);
    }
    Engine.go(()=>rescued('drove'));
  };
  B('j5').onclick = ()=> Engine.go(radioScene);
  B('j6').onclick = ()=> Engine.go(arrive);
}


function arrive(){
  Engine.badge(player.at==='jeep' ? 'THE JEEP' : 'DAY ' + player.day);
  const n = N[player.at];
  const t = TERRAIN[n.t];
  const near = (ADJ[player.at] || []).filter(id => !N[id].hidden || player.spotted[id] || player.visited[id]);
  const spottedNow = spotFrom();
  const T = temp();
  const night = isNight(player.clock);
  const shade = shadeHere();

  // The country reads differently depending on how bad things are.
  const cond = condition();
  const bodyLine =
    cond === 'critical' ? '<div class="story"><span class="danger">The water is gone.' +
      (player.dry > 5 ? ' You have stopped sweating, which is the sign everyone misreads as improvement.'
                      : ' Everything from here runs on a clock you cannot read.') + '</span></div>' :
    cond === 'bad'      ? '<div class="story"><span class="danger">Head pounding, mouth thick, and the light has gone hard at the edges.</span></div>' :
    cond === 'poor'     ? '<div class="story">Thirsty in the way that stops being a sensation and becomes a fact about you.</div>' :
    cond === 'worn'     ? '<div class="story">Feet complaining. Otherwise holding.</div>' : '';

  const heatWarn = (!night && T >= 34 && shade === 'none')
    ? '<div class="story"><span class="danger">No shade here and it is ' + T + '\u00b0C. Standing still in this costs almost as much as walking.</span></div>' : '';

  const opts = near.map(id=>{
    const known = knows(id);
    const h = hours(player.at,id)/paceFactor();
    const cost = drinkRate('walk') * h;
    const dir = compass(bearing(player.at,id));
    const risk = (night && !known && N[id].t!=='road' && N[player.at].t!=='ridge')
      ? ' \u00b7 easy to miss in the dark' : '';

    if(known){
      return '<button class="choice" data-go="' + id + '">' +
        '<span class="tag">' + dir + ' \u00b7 ' + km(player.at,id).toFixed(1) + ' km \u00b7 ~' +
          h.toFixed(1) + ' h \u00b7 ~' + cost.toFixed(1) + ' L' + risk + '</span>' +
        N[id].name + (player.visited[id] ? '' : ' \u2014 spotted from a distance') +
        '</button>';
    }
    // Unknown ground: a heading, a surface, and a guess.
    const surface = N[id].t === 'road'
      ? (N[player.at].t === 'road' ? 'The track runs on this way' : 'A vehicle track')
      : 'Open ' + TERRAIN[N[id].t].label;
    return '<button class="choice" data-go="' + id + '">' +
      '<span class="tag">' + dir + ' \u00b7 ' + vagueDistance(km(player.at,id)) + risk + '</span>' +
      surface + ' \u2014 you have not been that way' +
      '</button>';
  }).join('');

  const ctx = [
    (player.at === 'jeep'
      ? '<button class="choice" data-act="jeep"><span class="tag">THE JEEP</span>Hood, tools, radio. ' +
        (player.fixed ? 'It runs.' : player.diagnosed ? FAULTS[RUN.fault].name + ', diagnosed.'
                                                      : 'You have not worked out what is wrong yet.') + '</button>'
      : ''),
    (player.at === 'jeep' && !player.note
      ? '<button class="choice" data-act="note"><span class="tag">LEAVE A NOTE</span>Date, time, water carried, direction of travel. Under the wiper.</button>'
      : ''),
    (player.at==='truck'     ? '<button class="choice" data-act="truck"><span class="tag">THE VEHICLE</span>Both front tyres flat. Driver door open.</button>' : ''),
    (player.at==='cache'     ? '<button class="choice" data-act="cache"><span class="tag">THE AMMO CAN</span>Under the rocks. Somebody put it here on purpose.</button>' : ''),
    (player.at==='mine'      ? '<button class="choice" data-act="mine"><span class="tag">THE ADIT</span>Shade, and cold air coming out of it.</button>' : ''),
    (player.at==='sensor'    ? '<button class="choice" data-act="sensor"><span class="tag">THE STRAIGHT LINE</span>Nothing else out here is straight.</button>' : ''),
    (player.at==='sensor' && found('camera')
      ? '<button class="choice" data-act="lid"><span class="tag">TWO KILOMETRES NORTH \u00b7 1 h</span>His last note said there is a lid. You know where the line runs.</button>' : ''),
    (player.at==='calib'     ? '<button class="choice" data-act="calib"><span class="tag">THE FENCE AND THE PLACARD</span>Read what it actually says.</button>' : ''),
    (player.at==='homestead' ? '<button class="choice" data-act="home"><span class="tag">LOOK AROUND</span>The walls, the stove flue, the tree.</button>' : ''),
    (player.at==='boundary'  ? '<button class="choice" data-act="bound"><span class="tag">READ THE SIGN</span>All of it, including the small print.</button>' : ''),
    readOption(),
    (sourceHere() && !player.drank[player.at]
      ? '<button class="choice" data-act="water"><span class="tag">CHECK FOR WATER</span>' +
        (player.read[player.at]
          ? (RUN.water[player.at] ? 'You read it as wet from up there. Confirm it.' : 'You read it as dry. Look anyway.')
          : 'See whether there is anything in it.') + '</button>'
      : ''),
    (player.at === 'balloon' && !player.mylar
      ? '<button class="choice" data-act="mylar"><span class="tag">TAKE THE MYLAR</span>A square metre of it. Signal mirrors are just bright flat things.</button>'
      : ''),
    ((player.mirror || player.mylar) && N[player.at].t === 'ridge'
      ? '<button class="choice" data-act="flash"><span class="tag">WORK THE MIRROR \u00b7 2 h</span>High ground, clear sky, and something reflective. This is how people actually get found.' + odds(8,'IMPROVISE',7) + '</button>'
      : '')
  ].join('');

  const restOpts =
    (shade !== 'none'
      ? '<button class="choice" data-rest="shade4"><span class="tag">SHADE UP \u00b7 4 h \u00b7 ~' +
          (drinkRate('shade')*4).toFixed(1) + ' L</span>Get out of the sun and do nothing. It is not doing nothing.</button>'
      : '<button class="choice" data-rest="rest2"><span class="tag">SIT \u00b7 2 h \u00b7 ~' +
          (drinkRate('rest')*2).toFixed(1) + ' L</span>No shade here worth the name. Rest anyway.</button>') +
    '<button class="choice" data-rest="night"><span class="tag">WAIT FOR DARK / FOR LIGHT \u00b7 ~' +
      (night ? 'until 05:30' : 'until 20:00') + '</span>Sit out the part of the day that kills people.</button>';

  Engine.render(
    (n.note ? '<div class="hereNote">' + n.note + '</div>' : '') +
    spotLine(spottedNow) +
    '<div class="story"><b>' + n.name + '</b> \u2014 ' + t.label + ', ' + n.el + ' m. ' +
      lightWord() + ', ' + T + '\u00b0C.</div>' +
    bodyLine + heatWarn +
    '<div class="thought">' + t.blurb + '</div>' +
    (player.at==='jeep' && player.day===1 ? whoKnowsBlock() : '') +
    (player.at==='jeep' && player.day>=2
      ? '<div class="legline">Day ' + player.day + '. ' +
        (RUN.expected.key === 'nobody'
          ? 'Nobody has noticed, because there is nobody to notice. No aircraft, no dust on the horizon, and no reason for either.'
          : RUN.expected.key === 'eventually'
            ? 'Somebody may have started wondering. Nothing has come up the valley yet.'
            : 'Somebody has noticed by now that you did not come back.') +
        ' Chance of being spotted here: <b>' + rescueLabel() + '</b>.</div>' : '') +
    '<div class="story" style="font-size:0.82rem; color:var(--stone);">Move, or wait.</div>' +
    '<div class="choices">' + ctx + restOpts + opts + '</div>'
  );
  document.querySelectorAll('#main .choice').forEach(b=>{
    if(b.dataset.go)   b.onclick = ()=> travelTo(b.dataset.go);
    if(b.dataset.rest) b.onclick = ()=> doRest(b.dataset.rest);
    if(b.dataset.act)  b.onclick = ()=> doAct(b.dataset.act);
  });
  refreshMap();
}



/* Glassing the valley from high ground for green and stock trails.
   Only worth doing where you can actually see down into it. */
function readOption(){
  if(N[player.at].t !== 'ridge') return '';
  const cands = (ADJ[player.at]||[]).filter(id =>
    RUN.water[id] !== undefined && !player.drank[id] && !player.read[id]);
  if(!cands.length) return '';
  return '<button class="choice" data-act="read"><span class="tag">READ THE COUNTRY \u00b7 1 h</span>' +
    'Glass the ground below for green, for stock trails, for anything turning.' +
    odds(12,'FIELDCRAFT',8) + '</button>';
}

function doAct(kind){
  if(kind === 'jeep')   return Engine.go(jeepScene);
  if(kind === 'cache')  return Engine.go(cacheScene);
  if(kind === 'truck')  return Engine.go(truckScene);
  if(kind === 'lid'){
    advance(1,'rest');
    if(checkDead()) return;
    return Engine.go(lidScene);
  }
  if(kind === 'mine')   return Engine.go(mineScene);
  if(kind === 'sensor') return Engine.go(sensorScene);
  if(kind === 'calib')  return Engine.go(calibScene);
  if(kind === 'home')   return Engine.go(homesteadScene);
  if(kind === 'bound')  return Engine.go(boundaryScene);
  if(kind === 'water') return Engine.go(drinkScene);
  if(kind === 'note'){
    player.note = true;
    Engine.log('Left a note on the windscreen.', 'l-good');
    Engine.render('<div class="story">You write it on the back of the registration, in block capitals, and wedge it under the wiper: ' +
      'the date, the time, how much water you took, and the direction you are walking.</div>' +
      '<div class="thought">If anyone ever reaches the Jeep, this is the difference between a search and a recovery. It costs nothing but the two minutes and the admission that you might not come back to it.</div>' +
      Engine.contBtn());
    return Engine.wire(arrive);
  }
  if(kind === 'read'){
    advance(1, shadeHere()!=='none' ? 'shade' : 'rest');
    if(checkDead()) return;
    const cands = (ADJ[player.at]||[]).filter(id=> RUN.water[id] !== undefined && !player.drank[id] && !player.read[id]);
    Engine.check({die:12, mod:mod('FIELDCRAFT'), dc:8, label:'Read the country (FIELDCRAFT)'}, (ok)=>{
      let out;
      if(ok){
        cands.forEach(id=> player.read[id] = true);
        out = cands.map(id=>{
          const has = !!RUN.water[id];
          return '<b>' + N[id].name + '</b> \u2014 ' + (has
            ? 'green showing at the base, and stock trails converging on it. <span style="color:var(--sage);">There is water there.</span>'
            : 'no green, no trails, and the ground around it is as pale as everything else. <span style="color:var(--rust);">Dry.</span>');
        }).join('<br><br>');
        Engine.sfxSuccess();
      } else {
        out = 'An hour of glassing the valley and you cannot tell one patch of grey-green brush from another. Everything down there looks the same, which is the problem with this country.';
      }
      Engine.log('Read the country: ' + (ok?'informative':'inconclusive'), ok?'l-good':'l-bad');
      Engine.render('<div class="hereNote">' + out + '</div>' +
        '<div class="thought">Cattle wear paths to water and nothing else out here is worth walking to. If the trails converge, so should you.</div>' +
        Engine.contBtn());
      Engine.refreshStatus();
      Engine.wire(arrive);
    });
    return;
  }
  if(kind === 'mylar'){
    player.mylar = true;
    Engine.sfxSuccess();
    Engine.log('Recovered mylar from the radiosonde.', 'l-good');
    Engine.render('<div class="story">The balloon envelope tears easily and folds smaller than you expect. ' +
      'The radiosonde itself is a cheap plastic box with a dead battery and a serial number, and it has been out here a while.</div>' +
      '<div class="thought">Every few years somebody finds one of these and it makes the local paper. Roswell was one of these.</div>' +
      Engine.contBtn());
    return Engine.wire(arrive);
  }
  if(kind === 'flash'){
    advance(2, shadeHere()!=='none' ? 'shade' : 'rest');
    if(checkDead()) return;
    Engine.check({die:8, mod:mod('IMPROVISE'), dc:7, label:'Work the mirror (IMPROVISE)'}, (ok)=>{
      if(ok){
        player.searchHeat += 26;
        Engine.sfxSuccess();
        Engine.log('Sustained mirror flashes from high ground.', 'l-good');
        Engine.render('<div class="story">Two hours of aiming at every aircraft contrail and every dust plume on every horizon. ' +
          'Twice you are certain something changed course. Once you are almost certain.</div>' +
          '<div class="thought">A mirror flash carries further than a fire, further than a shout, further than anything else you have. On a clear day it is visible for tens of miles.</div>' +
          Engine.contBtn());
      } else {
        Engine.render('<div class="story">Two hours of throwing light at empty sky. Nothing came, or nothing saw.</div>' + Engine.contBtn());
      }
      Engine.refreshStatus();
      Engine.wire(arrive);
    });
    return;
  }
}


/* ---------------- THE TRUCKS ----------------
   No dialogue, no confrontation, no explanation. They arrive,
   they sit, they leave. The whole effect is that nothing
   happens, repeatedly, on purpose.                            */
function truckChance(){
  const t = N[player.at].t;
  const west = ['boundary','baj_w','wash_w','playa_s','twotrack_s','mudflat'].indexOf(player.at) !== -1;
  if(!west && player.anomaly < 3) return 0;
  let p = west ? 0.16 : 0.05;
  p += player.anomaly * 0.02;
  if(t === 'ridge') p += 0.05;              // you are skylined
  if(isNight(player.clock)) p *= 0.4;
  return Math.min(0.35, p);
}
function maybeTruck(next){
  if(Math.random() > truckChance()) return next();
  player.trucks += 1;
  const n = player.trucks;
  Engine.badge('ON THE RISE');
  const body = n === 1 ? seen(
      "A white pickup on the rise about a kilometre south. Clean, newish, no markings and no plate you can read at this distance. " +
      "It is not coming toward you. It has stopped, facing you, and the engine is off.",
      "White pickup on the rise. No markings. It has stopped and it is facing this way and the engine is off, and you have been looking at it long enough to be sure of all three.",
      "There is a white truck on the rise. You are not certain how long it has been there. You are fairly sure it was not there."
    )
    : n === 2 ? seen(
      "The same pickup, or one exactly like it, on a different rise. Same distance. Same stillness. Nobody gets out.",
      "It is here again. Same distance, which is the part you keep coming back to \u2014 not closer, not further, the same.",
      "Again. The same distance. You have started measuring it against your thumb."
    )
    : seen(
      "Two of them now, parked apart, both facing you. You raise a hand. After a moment, somebody raises one back.",
      "Two. You raise a hand and after a moment somebody raises one back, and that is somehow the worst part of the whole week.",
      "You wave at them. One waves back. You sit down."
    );
  Engine.render(
    '<div class="hereNote">' + body + '</div>' +
    '<div class="choices">' +
      '<button class="choice" id="t1"><span class="tag">WALK TOWARD IT</span>You need water more than you need to be polite about this.</button>' +
      '<button class="choice" id="t2"><span class="tag">SIGNAL</span>Arms, shirt, anything. Make it unmistakable that you are in trouble.' + odds(8,'IMPROVISE',7) + '</button>' +
      '<button class="choice" id="t3"><span class="tag">DO NOTHING</span>Let them watch. Get on with your day.</button>' +
    '</div>'
  );
  document.getElementById('t1').onclick = ()=>{
    advance(1,'rest');
    if(checkDead()) return;
    Engine.render('<div class="story">You get maybe four hundred metres before it starts, reverses off the rise without turning around, and is gone behind the ridge line.</div>' +
      '<div class="thought">An hour and a litre to learn that it did not want to be approached. You did learn that.</div>' + Engine.contBtn());
    Engine.wire(next);
  };
  document.getElementById('t2').onclick = ()=>{
    advance(0.5,'rest');
    if(checkDead()) return;
    Engine.check({die:8, mod:mod('IMPROVISE'), dc:7, label:'Signal the truck (IMPROVISE)'}, (ok)=>{
      if(ok){
        player.searchHeat += 30;
        Engine.log('You were seen, and they know it.', 'l-good');
        Engine.render('<div class="story">Shirt off, both arms, the full slow wave that means distress and not hello. ' +
          'The truck does not move. But after about a minute it flashes its headlights, twice, and then goes on sitting there.</div>' +
          '<div class="thought">Somebody now knows there is a man on foot out here. What they do about it is entirely up to them and on a timescale you do not control.</div>' +
          Engine.contBtn());
      } else {
        Engine.render('<div class="story">You wave until your shoulders burn. Nothing acknowledges it. At some point you look up and the rise is empty.</div>' + Engine.contBtn());
      }
      Engine.refreshStatus();
      Engine.wire(next);
    });
  };
  document.getElementById('t3').onclick = ()=>{
    Engine.render('<div class="story">You get on with your day. When you next look up, it is gone, and you did not hear it go.</div>' + Engine.contBtn());
    Engine.wire(next);
  };
}

/* ---------------- SNAKES ----------------
   Not a fight. A thing you nearly stepped on.                  */
function snakeRisk(){
  const t = (player.clock % 24 + 24) % 24;
  const warm = temp() >= 22 && temp() <= 34;
  const dusk = (t >= 18.5 && t <= 23) || (t >= 4.5 && t <= 7.5);
  const ground = ['wash','ruin','mine','bajada'].indexOf(N[player.at].t) !== -1;
  if(!ground || !warm) return 0;
  return dusk ? 0.13 : 0.05;
}
function maybeSnake(next){
  if(player.bitten || Math.random() > snakeRisk()) return next();
  Engine.badge('CAREFUL');
  Engine.render(
    '<div class="hereNote">The buzz does not sound like a rattle. It sounds like a sprinkler, or a cicada, or nothing at all until your body understands it before you do and you are already stopping.</div>' +
    '<div class="story">A Great Basin rattlesnake, coiled in the shade of the rock you were about to put a hand on.</div>' +
    '<div class="choices">' +
      '<button class="choice" id="s1"><span class="tag">BACK OFF SLOWLY</span>Give it the whole rock. Go around.' + odds(12,'FIELDCRAFT',7) + '</button>' +
      '<button class="choice" id="s2"><span class="tag">FREEZE</span>Do nothing at all and let it decide.' + odds(20,'ENDURANCE',9) + '</button>' +
    '</div>'
  );
  const resolve = (ok)=>{
    if(ok){
      Engine.render('<div class="story">It holds its ground, and you give it a wide berth, and that is the entire event. ' +
        'Your hands do not stop shaking for a while.</div>' + Engine.contBtn());
    } else {
      player.bitten = true;
      player.core += 18;
      Engine.sfxHurt();
      Engine.log('Bitten. Left hand.', 'l-bad');
      Engine.render('<div class="story"><span class="danger">It gets you on the back of the left hand.</span> Two punctures, not much blood, and a burning that arrives about thirty seconds later and does not stop arriving.</div>' +
        '<div class="thought">No cutting, no sucking, no tourniquet \u2014 all of that is worse than nothing. Keep it below the heart, stay calm, and understand that calm is now a physical task.</div>' + Engine.contBtn());
    }
    Engine.refreshStatus();
    Engine.wire(next);
  };
  document.getElementById('s1').onclick = ()=>
    Engine.check({die:12, mod:mod('FIELDCRAFT'), dc:7, label:'Back off (FIELDCRAFT)'}, resolve);
  document.getElementById('s2').onclick = ()=>
    Engine.check({die:20, mod:mod('ENDURANCE'), dc:9, label:'Freeze (ENDURANCE)'}, resolve);
}

function doRest(kind){
  if(kind === 'shade4') return restFor(4, 'shade');
  if(kind === 'rest2')  return restFor(2, 'rest');
  // wait out the heat, or wait out the dark
  const t = (player.clock % 24 + 24) % 24;
  let h;
  if(isNight(player.clock)) h = (t >= 20 ? (24 - t) + 5.5 : 5.5 - t);
  else                      h = 20 - t;
  h = Math.max(0.5, Math.round(h*10)/10);
  return restFor(h, shadeHere() !== 'none' ? 'shade' : 'rest');
}

function travelTo(id){
  const from = player.at;
  const d = km(from,id);
  const h = hours(from,id) / paceFactor();
  const night = isNight(player.clock);
  const known = !!player.visited[id];

  // Walking at night is correct — far less water — but finding an
  // unvisited point in the dark on open ground is a different job.
  let lost = false;
  if(night && !known && N[id].t !== 'road'){
    const anchor = N[from].t === 'ridge' || player.spotted[id];
    if(!anchor && Math.random() < 0.35) lost = true;
  }

  advance(h, 'walk');
  player.legs += 1;
  player.walked += d;

  if(lost){
    // You did not arrive. You spent the hours anyway.
    const back = Engine.pick(ADJ[from].filter(x=>x!==id).concat([from]));
    player.at = back;
    player.visited[back] = true;
    Engine.log('Lost the line in the dark. ' + d.toFixed(1) + ' km walked, nowhere useful.', 'l-bad');
    Engine.sfxFail();
    if(checkDead()) return;
    return Engine.go(()=>strayed(id, back, h));
  }

  player.at = id;
  player.visited[id] = true;
  Engine.log('Walked ' + d.toFixed(1) + ' km ' + compass(bearing(from,id)) + ' to ' + N[id].name +
             ' \u2014 ' + h.toFixed(1) + ' h, ' + player.water.toFixed(1) + ' L left.', 'l-info');
  if(checkDead()) return;
  if(rollRescue(h)) return Engine.go(()=>rescued('walk'));
  Engine.go(()=>maybeSnake(()=>maybeTruck(arrive)));
}

function strayed(intended, actual, h){
  Engine.badge('LOST');
  Engine.render(
    '<div class="hereNote">You walked ' + h.toFixed(1) + ' hours on a bearing you were sure of, and the ground did not match. ' +
    'No landmark, no lights, and the range you were using to steer by went black an hour ago.</div>' +
    '<div class="story">When the sky greys enough to read the country, you are at <b>' + N[actual].name + '</b>. ' +
    'Not ' + N[intended].name + '. The water is gone regardless.</div>' +
    '<div class="thought">This is the part nobody tells you about walking at night. The cool is real and the savings are real, and none of it helps if you arrive somewhere else.</div>' +
    Engine.contBtn()
  );
  Engine.wire(arrive);
}

/* ---------------- ENDINGS ---------------- */
function rescued(how){
  player.saved = how;
  const id = player.at;
  let text;
  if(how === 'drove'){
    text = "It catches on the third crank and idles like nothing happened. You drive out at fifteen miles an hour, watching the temperature gauge the whole way, and you hit the graded road as the light goes orange. " +
           "Nobody ever knows this happened except you.";
  } else if(id === 'jeep'){
    text = "A Civil Air Patrol Cessna comes up the valley at maybe six hundred feet, following the two-track because that is what you follow when you are looking for a vehicle. It banks once, comes back lower, and waggles its wings. " +
           "It found the Jeep. It was never going to find you.";
  } else if(N[id].t === 'road'){
    text = "A truck. Actual dust on the horizon resolving into an actual truck, and it slows, and the window comes down, and a rancher who is not remotely surprised to see you asks if you are the one with the Jeep.";
  } else {
    text = (player.trucks > 0
      ? "The same white pickup, or one exactly like it, comes over the rise and this time it does not stop at a kilometre. Two men get out. They give you water before they ask you anything, which you appreciate more than you can express, and then they ask you a number of things."
      : "A white pickup with no markings comes over the rise and stops thirty metres off. Two men get out. They give you water before they ask you anything, which you appreciate, and then they ask you a number of things.")
      + (found('sensor')
        ? " One of them asks, pleasantly, whether you did any digging. You tell him the truth, because you have run out of everything including the energy to do otherwise, and he writes it down and does not react."
        : "")
      + " Then they drive you to a gate and have you sign a form about what you did and did not see.";
  }
  const tangled = player.threads.filter(t=>THREADS[t]).length;
  const coda = tangled >= 5
    ? "<div class=\"thought\">Nobody asks what you found out there, because the question people ask is whether you are all right. " +
      "You have a serial number written on your hand in your own writing, half a frequency you cannot stop hearing, and a photograph you did not take of a chamber full of bottles. " +
      "Every single piece of it has an explanation. You have all of the explanations and you are going to be thinking about it for years.</div>"
    : tangled >= 3
      ? "<div class=\"thought\">You will tell the water story. It is a good story and it is the one people want. The other thing you will mention once, to one person, and watch their face, and then not mention again.</div>"
      : "";
  Engine.recordEnding(how === 'drove' ? 'drove-out'
      : 'rescued-' + (id === 'jeep' ? 'vehicle' : N[id].t === 'road' ? 'road' : 'other'),
    {day:player.day, water:+player.water.toFixed(1), walked:+player.walked.toFixed(1), at:id, tangled:tangled});
  Engine.sfxSuccess();
  Engine.badge('FOUND');
  Engine.render(
    '<div class="story"><span class="flavor">' + (how==='drove'?'DROVE OUT':'FOUND') + ' \u2014 DAY ' + player.day + ', ' + clockStr(player.clock) + '</span></div>' +
    '<div class="story">' + text + '</div>' + coda + manifest() +
    '<button class="smallbtn primary-go" id="again">ANOTHER TRIP \u2192</button>'
  );
  document.getElementById('again').onclick = ()=>Engine.restart();
}

function ending(){
  const how = player.dead;
  const far = km('jeep', player.at);
  let text;
  if(how === 'thirst'){
    text = "The water ran out " + (far < 1 ? "at the Jeep" : far.toFixed(1) + " kilometres from the Jeep") +
           " and there was nothing between here and anywhere. It is not dramatic. You get slower, and then you get confused, and the confusion is the part that finishes it.";
  } else {
    text = "Core temperature is the one that gets people who think thirst is the danger. You stopped sweating an hour ago and took that as good news.";
  }
  const lesson = (player.at === 'jeep')
    ? (RUN.expected.key === 'nobody'
        ? "You stayed with the vehicle. That is the advice, and the advice assumes a search, and a search assumes somebody noticed you were gone. Nobody did. Staying was the right move in a situation you were not actually in."
        : "You stayed. That was right. The margin was simply not there \u2014 the water and a valley this size is a hard arithmetic problem no matter how well you play it.")
    : "The Jeep is " + far.toFixed(1) + " km back that way, with shade, and a shape an aircraft can see from six hundred feet"
      + (RUN.expected.key === 'nobody' ? " \u2014 though nobody was ever going to be flying it." : ".");
  Engine.recordEnding('lost-' + how, {day:player.day, walked:+player.walked.toFixed(1), at:player.at});
  Engine.sfxFail();
  Engine.badge('END');
  Engine.render(
    '<div class="story"><span class="danger">DAY ' + player.day + ', ' + clockStr(player.clock) + '</span></div>' +
    '<div class="story">' + text + '</div>' +
    '<div class="thought">' + lesson + '</div>' +
    (player.threads.filter(t=>THREADS[t]).length >= 4
      ? '<div class="thought">Whatever else you worked out in the last three days goes with you. The logbook is still in the can. The can is still under the rocks.</div>' : '') +
    manifest() +
    '<button class="smallbtn primary-go" id="again">ANOTHER TRIP \u2192</button>'
  );
  document.getElementById('again').onclick = ()=>Engine.restart();
}

function manifest(){
  return '<div style="border:1px solid var(--mist); background:var(--cream); padding:12px 14px; margin:18px 0; font-family:\'DM Mono\',monospace; font-size:0.64rem; line-height:1.8;">' +
    '<div style="font-size:0.56rem; letter-spacing:0.12em; text-transform:uppercase; color:var(--stone); margin-bottom:8px;">Trip log</div>' +
    'Days out: <b style="color:var(--ink);">' + player.day + '</b><br>' +
    'On foot: <b style="color:var(--ink);">' + player.walked.toFixed(1) + ' km</b> over ' + player.legs + ' legs<br>' +
    'Water remaining: <b style="color:var(--ink);">' + player.water.toFixed(1) + ' L</b><br>' +
    'Furthest from the Jeep: <b style="color:var(--ink);">' + km('jeep', player.at).toFixed(1) + ' km</b><br>' +
    'Places reached: <b style="color:var(--ink);">' + Object.keys(player.visited).length + ' / ' + NODES.length + '</b>' +
    (player.threads.filter(t=>THREADS[t]).length
      ? '<div style="margin-top:8px; padding-top:8px; border-top:1px solid var(--mist);">' +
        '<div style="font-size:0.56rem; letter-spacing:0.12em; text-transform:uppercase; color:var(--stone); margin-bottom:5px;">Loose ends</div>' +
        player.threads.filter(t=>THREADS[t]).map(t=>'\u25c8 ' + THREADS[t]).join('<br>') + '</div>'
      : '') +
    '<div style="margin-top:8px; padding-top:8px; border-top:1px solid var(--mist); color:var(--stone);">' +
      'Trips taken: <b style="color:var(--ink);">' + Engine.runCount() + '</b>' +
    '</div></div>';
}

/* ---------------- LAUNCH ---------------- */
Engine.init({
  id: 'stay-with-the-vehicle',
  title: 'RAILROAD VALLEY',
  subtitle: 'Nine litres \u00b7 Nye County, Nevada \u00b7 nobody within forty miles',
  accent: 'var(--rust)',
  mode: 'over',
  sheetLabel: 'TERRAIN',
  lockBackOn: [],
  state: ()=>{ rollRun(); player = freshState(); return player; },
  status: statusFields,
  sheet: sheetHTML,
  panel: buildMap,
  panelUpdate: refreshMap,
  start: startTrip
});
</script>
