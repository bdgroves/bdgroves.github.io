<script>
/* ============================================================
   STAY WITH THE VEHICLE
   Railroad Valley, Nye County, Nevada.
   Phase 1: terrain, movement, and the map. No survival systems
   wired in yet — this is the board before the rules.

   Coordinates are real. The two-track and the breakdown point
   are fiction. This is a game, not a route guide.
   ============================================================ */

/* ---------------- TERRAIN ---------------- */
const TERRAIN = {

            blurb:"Compacted. Easy going, and the only surface anyone drives." },

            blurb:"Sand and gravel. Slower than it looks, and it channels water when there is any." },

            blurb:"Climbing. Costly in every way except the one that matters — you can see, and be seen." },

            blurb:"Tailings and cut benches. Old ground, badly kept." },
  ruin:   { label:"ruin",             color:'#a06840', pace:3.5,
            blurb:"Somebody tried to live here. The evidence is mostly foundations." },
  water:  { label:"tank / windmill",  color:'#2f7d8c', pace:3.4,
            blurb:"Stock water. Somebody drilled here because somebody had to." }
};

/* ---------------- THE VALLEY ---------------- */
const NODES = [
  { id:'jeep',      name:"The Jeep",             lat:38.3180, lon:-115.7450, t:'road',   el:1460,
    note:"Where it stopped. Hood up, nose pointed at nothing in particular. Everything you have is here." },
  { id:'playa_n',   name:"Playa, north lobe",    lat:38.4020, lon:-115.7710, t:'playa',  el:1440 },
  { id:'playa_c',   name:"Playa, center",        lat:38.3520, lon:-115.7960, t:'playa',  el:1435 },
  { id:'calib',     name:"Calibration site",     lat:38.4970, lon:-115.6900, t:'playa',  el:1437, tall:true,
    note:"Instrument masts on the mud. Fenced, solar-powered, immaculately maintained, and nobody is here." },
  { id:'playa_s',   name:"Playa, south edge",    lat:38.2810, lon:-115.8080, t:'playa',  el:1438 },
  { id:'mudflat',   name:"Wet mudflat",          lat:38.3300, lon:-115.8380, t:'playa',  el:1433,
    note:"Crust gives underfoot. Every step costs double and one of them will take a boot." },

  { id:'baj_w',     name:"West bajada",          lat:38.3400, lon:-115.8900, t:'bajada', el:1580 },
  { id:'wash_w',    name:"West wash",            lat:38.3010, lon:-115.9120, t:'wash',   el:1620 },
  { id:'pancake',   name:"Pancake Range foot",   lat:38.3600, lon:-115.9600, t:'ridge',  el:1890 },
  { id:'spring_w',  name:"Seep below the rocks", lat:38.3760, lon:-115.9480, t:'wash',   el:1810,
    note:"Green where nothing else is green. That means water, or it means water used to be here." },

  { id:'baj_e',     name:"East bajada",          lat:38.3260, lon:-115.6300, t:'bajada', el:1610 },
  { id:'wash_e',    name:"East wash",            lat:38.2960, lon:-115.5980, t:'wash',   el:1690 },
  { id:'grant',     name:"Grant Range front",    lat:38.3450, lon:-115.5400, t:'ridge',  el:2130 },
  { id:'mine',      name:"The adit",             lat:38.3610, lon:-115.5620, t:'mine',   el:2020,
    note:"A hole in the hillside with a rail stub coming out of it. Cold air on your face, which is the good news and the bad news." },
  { id:'headframe', name:"Collapsed headframe",  lat:38.3680, lon:-115.5750, t:'mine',   el:1960, tall:true },

  { id:'homestead', name:"The homestead",        lat:38.2650, lon:-115.6720, t:'ruin',   el:1520,
    note:"Four walls, no roof, and a cottonwood that has no business being alive out here and is." },
  { id:'well',      name:"The well",             lat:38.2620, lon:-115.6760, t:'ruin',   el:1518,
    note:"Casing pipe, hand pump, no handle. Drop a rock and count." },
  { id:'corral',    name:"Corral posts",         lat:38.2710, lon:-115.6640, t:'ruin',   el:1525 },

  { id:'cow',       name:"Cattle",               lat:38.2440, lon:-115.7050, t:'bajada', el:1490,
    note:"Six head, standing in the open. Cattle do not range far from water \u2014 three miles, give or take. That is not folklore. That is a fact you can walk on." },
  { id:'trough',    name:"Stock tank",           lat:38.2280, lon:-115.7240, t:'water',  el:1478,
    note:"Float valve, algae, and a pipe running somewhere uphill to something." },
  { id:'mill_s',    name:"Windmill, south",      lat:38.2050, lon:-115.7000, t:'water',  el:1482, tall:true,
    note:"Aermotor head, most of a tail vane, turning when it feels like it. The tank below is half full and the water is not clean and that is not the same as undrinkable." },
  { id:'mill_n',    name:"Windmill, north",      lat:38.4260, lon:-115.7960, t:'water',  el:1447, tall:true,
    note:"Standing but not turning — the sucker rod is disconnected and hanging. The tank is dry and has been for a long time." },
  { id:'tank_e',    name:"Buried tank",          lat:38.3020, lon:-115.6620, t:'water',  el:1545,
    note:"A steel tank set into the bajada with a lid you can lift. Whether anything is in it is a separate question." },
  { id:'pipeline',  name:"Pipeline scar",        lat:38.2360, lon:-115.7520, t:'bajada', el:1495 },

  { id:'balloon',   name:"Downed balloon",       lat:38.3860, lon:-115.8320, t:'playa',  el:1442,
    note:"Mylar and a shattered radiosonde. The mylar is the useful half." },
  { id:'cache',     name:"Cairn on the point",   lat:38.3960, lon:-115.6480, t:'ridge',  el:1720,
    note:"Ammo can under the rocks. Damp logbook, pencil stub. Somebody has been coming out here for years." },
  { id:'sensor',    name:"Something buried",     lat:38.2900, lon:-115.7860, t:'playa',  el:1436 },
  { id:'boundary',  name:"Range boundary",       lat:38.1900, lon:-115.8600, t:'bajada', el:1530,
    note:"USE OF DEADLY FORCE AUTHORIZED. The fence behind the sign is three strands and forty years old." },

  { id:'knob_n',    name:"North knob",           lat:38.4380, lon:-115.6900, t:'ridge',  el:1840 },
  { id:'knob_s',    name:"South knob",           lat:38.2120, lon:-115.6420, t:'ridge',  el:1910 },
  { id:'saddle',    name:"Grant Range saddle",   lat:38.3550, lon:-115.4980, t:'ridge',  el:2480,
    note:"High enough that a phone might find something. Two thousand feet of climb to find out." },

  { id:'twotrack_n',name:"Two-track, north",     lat:38.4600, lon:-115.7300, t:'road',   el:1455 },
  { id:'twotrack_s',name:"Two-track, south",     lat:38.2200, lon:-115.7800, t:'road',   el:1470 },
  { id:'graded',    name:"Graded county road",   lat:38.5400, lon:-115.6600, t:'road',   el:1490,
    note:"Actual gravel, actual grading. Someone maintains this, which means someone drives it." },
  { id:'us6',       name:"US-6",                 lat:38.6900, lon:-115.5900, t:'road',   el:1720,
    note:"Pavement. Ely to Tonopah. A vehicle every twenty minutes, or every three hours, depending on the day and your luck." },
  { id:'nyala',     name:"Nyala junction",       lat:38.0700, lon:-115.5300, t:'road',   el:1580,
    note:"A road sign and a cattle guard. It is not a town. It has never been a town." }
];

const EDGES = [
  ['jeep','playa_c'],['jeep','playa_n'],['jeep','baj_w'],['jeep','baj_e'],
  ['jeep','twotrack_n'],['jeep','twotrack_s'],['jeep','sensor'],
  ['playa_n','playa_c'],['playa_n','calib'],['playa_n','balloon'],['playa_n','twotrack_n'],
  ['playa_c','playa_s'],['playa_c','mudflat'],['playa_c','balloon'],['playa_c','sensor'],
  ['playa_s','mudflat'],['playa_s','twotrack_s'],['playa_s','baj_w'],
  ['mudflat','baj_w'],['balloon','baj_w'],
  ['calib','knob_n'],['calib','graded'],
  ['baj_w','wash_w'],['baj_w','pancake'],['wash_w','pancake'],['pancake','spring_w'],['wash_w','spring_w'],
  ['baj_w','boundary'],['boundary','twotrack_s'],
  ['baj_e','wash_e'],['baj_e','grant'],['baj_e','homestead'],['baj_e','cache'],
  ['wash_e','grant'],['grant','mine'],['mine','headframe'],['headframe','grant'],
  ['grant','saddle'],['saddle','mine'],
  ['homestead','well'],['homestead','corral'],['corral','baj_e'],
  ['homestead','cow'],['cow','trough'],['trough','pipeline'],['pipeline','twotrack_s'],
  ['cow','twotrack_s'],['homestead','knob_s'],['knob_s','wash_e'],
  ['trough','mill_s'],['mill_s','knob_s'],['mill_s','twotrack_s'],
  ['playa_n','mill_n'],['mill_n','balloon'],['mill_n','twotrack_n'],
  ['baj_e','tank_e'],['tank_e','corral'],['tank_e','homestead'],
  ['cache','knob_n'],['knob_n','graded'],['knob_n','twotrack_n'],
  ['twotrack_n','graded'],['graded','us6'],
  ['twotrack_s','nyala'],['knob_s','nyala']
];

const N = Object.fromEntries(NODES.map(n=>[n.id,n]));
const ADJ = {};
NODES.forEach(n=> ADJ[n.id]=[]);
EDGES.forEach(([a,b])=>{ ADJ[a].push(b); ADJ[b].push(a); });

/* ---------------- GEO ---------------- */
function metres(a,b){
  const R=6371000, rad=d=>d*Math.PI/180;
  const dp=rad(b.lat-a.lat), dl=rad(b.lon-a.lon);
  const x=Math.sin(dp/2)**2 + Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dl/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));
}
function km(a,b){ return metres(N[a],N[b])/1000; }
// Hours on foot, terrain-weighted, with a climb penalty (Naismith-ish).
function hours(a,b){
  const d = km(a,b);
  const pace = (TERRAIN[N[a].t].pace + TERRAIN[N[b].t].pace)/2;
  const climb = Math.max(0, N[b].el - N[a].el);
  return d/pace + climb/600;
}
function bearing(a,b){
  const rad=d=>d*Math.PI/180, deg=r=>r*180/Math.PI;
  const φ1=rad(N[a].lat), φ2=rad(N[b].lat), Δλ=rad(N[b].lon-N[a].lon);
  const y=Math.sin(Δλ)*Math.cos(φ2);
  const x=Math.cos(φ1)*Math.sin(φ2)-Math.sin(φ1)*Math.cos(φ2)*Math.cos(Δλ);
  return (deg(Math.atan2(y,x))+360)%360;
}
function compass(deg){
  const pts=['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
  return pts[Math.round(deg/22.5)%16];
}



/* ---------------- THE DAY ----------------
   Railroad Valley in summer. Cold at dawn, murderous by late
   afternoon, and the difference decides everything you do.     */
function tempAt(h){
  const x = ((h % 24) - 4) / 24 * Math.PI * 2;
  return Math.round(26 - 12 * Math.cos(x));      // ~14C at 04:00, ~38C at 16:00
}
function temp(){ return tempAt(player.clock); }
function clockStr(h){
  const t = ((h % 24) + 24) % 24;
  const hh = Math.floor(t), mm = Math.floor((t - hh) * 60);
  return String(hh).padStart(2,'0') + ':' + String(mm).padStart(2,'0');
}
function isNight(h){ const t=(h%24+24)%24; return t < 5.5 || t >= 20.0; }
function lightWord(){
  const t = (player.clock % 24 + 24) % 24;
  if(t < 4.5)  return 'dark';
  if(t < 6.0)  return 'first grey';
  if(t < 8.0)  return 'early light';
  if(t < 11.0) return 'morning';
  if(t < 15.0) return 'high sun';
  if(t < 18.5) return 'late heat';
  if(t < 20.0) return 'evening';
  return 'dark';
}

/* Litres per hour. Heat drives everything. */
function drinkRate(activity){
  const T = temp();
  const over = Math.max(0, T - 20);
  if(activity === 'walk')  return 0.40 + over * 0.055;
  if(activity === 'shade') return 0.10 + over * 0.016;
  return 0.14 + over * 0.034;                        // resting in the open
}
function heatGain(activity){
  const T = temp();
  if(activity === 'walk')  return Math.max(-6, (T - 30) * 1.7);
  if(activity === 'shade') return Math.min(0, (T - 34) * 0.5) - 5;
  return (T - 33) * 0.6 - 1;
}

function advance(h, activity){
  player.clock += h;
  while(player.clock >= 24){ player.clock -= 24; player.day += 1; }
  const need = drinkRate(activity) * h;
  const short = Math.max(0, need - player.water);
  player.water = Math.max(0, player.water - need);
  if(player.water <= 0){
    // Once you are out, heat and effort decide how fast this goes.
    const T = temp();
    const load = (activity === 'walk' ? 1.7 : activity === 'shade' ? 0.75 : 1.0);
    const heat = 1 + Math.max(0, T - 24) / 22;
    player.dry += (short > 0 ? h : h) * load * heat;
  }
  player.core  = Math.max(0, Math.min(100, player.core + heatGain(activity) * h));
  if(activity === 'walk'){
    // dehydration makes everything worse, including your feet
    const dry = player.water < 2 ? 1.5 : 1;
    player.feet = Math.min(100, player.feet + h * 2.2 * dry);
  } else {
    player.feet = Math.max(0, player.feet - h * 1.4);
  }
  // nobody starts looking on day one
  if(player.day >= 2) player.searchHeat += h * (player.day >= 3 ? 1.6 : 0.7);
  Engine.refreshStatus();
}

/* How wrong things are, in one number. Drives the prose. */
function strain(){
  // Below ~9 L you are on a budget; at zero the clock is player.dry,
  // which is what actually kills you.
  const thirst = player.water <= 0
    ? 70 + Math.min(30, player.dry / 9 * 30)
    : Math.max(0, 70 - player.water/9*70);
  return Math.round(Math.min(100, Math.max(thirst, player.core*0.85, player.feet*0.55)));
}
function condition(){
  const s = strain();
  if(player.water <= 0) return 'critical';
  if(s >= 75) return 'bad';
  if(s >= 50) return 'poor';
  if(s >= 25) return 'worn';
  return 'ok';
}

/* Walking gets slower as you fall apart. */
function paceFactor(){
  let f = 1;
  if(player.feet > 55) f *= 0.82;
  if(player.feet > 80) f *= 0.78;
  if(player.core > 60) f *= 0.85;
  if(player.water < 2) f *= 0.85;
  return f;
}

/* ---------------- SEEING ----------------
   On a flat valley floor you can see almost nothing. From high
   ground you can see a very long way, and the only things worth
   seeing at that range are tall: a windmill, a headframe, masts.
   This is how you actually navigate that country.               */
function seeingRange(){
  const here = N[player.at];
  if(here.t === 'ridge') return 22;      // km, from a knob or saddle
  if(here.el >= 1900)    return 18;
  if(here.t === 'playa') return 6;       // dead flat, heat shimmer
  return 9;
}
function spotFrom(){
  const range = seeingRange();
  const found = [];
  NODES.forEach(n=>{
    if(n.id === player.at) return;
    if(player.visited[n.id] || player.spotted[n.id]) return;
    if(!n.tall) return;                                   // only tall things carry
    if(km(player.at, n.id) > range) return;
    player.spotted[n.id] = true;
    found.push(n);
  });
  return found;
}
function spotLine(found){
  if(!found.length) return '';
  return '<div class="spotted"><b>From here you can see:</b><br>' +
    found.map(n=> n.name + ' \u2014 ' + km(player.at,n.id).toFixed(1) + ' km ' +
      compass(bearing(player.at,n.id))).join('<br>') +
    '</div>';
}


/* You know a place if you have been there, or seen it from high
   ground. Otherwise you know a direction and the look of the
   ground, and nothing whatsoever about how far it runs.          */
function knows(id){ return !!player.visited[id] || !!player.spotted[id]; }
function vagueDistance(d){
  if(d < 5)  return 'not far';
  if(d < 10) return 'a fair way';
  if(d < 16) return 'a long way';
  return 'no telling how far';
}

/* ---------------- STATE ---------------- */
function freshState(){ return {
  at:'jeep',
  visited:{jeep:true},
  spotted:{},
  legs:0,
  walked:0,        // km on foot
  clock:14.5,      // hours since midnight, day 1. It broke down in the afternoon.
  day:1,
  water:9.0,       // litres. Everything you have.
  core:0,          // heat strain, 0-100
  dry:0,           // effective hours since the water ran out
  feet:0,          // wear, 0-100
  shaded:false,
  searchHeat:0,    // how likely anyone is looking for you yet
  dead:null,
  saved:null
}; }
let player;

/* ---------------- MAP ---------------- */
let map=null, markers={}, lines=[], hereRing=null, mapOK=false;

function buildMap(el){
  el.innerHTML = '<div id="map"></div>' +
    '<div class="maplegend">' +
      Object.keys(TERRAIN).map(k=>
        '<span><i style="background:'+TERRAIN[k].color+'"></i>'+TERRAIN[k].label+'</span>').join('') +
    '</div>';

  if(typeof L === 'undefined'){
    document.getElementById('map').outerHTML =
      '<div class="nomap">The map could not load.<br>Everything still works \u2014 you can travel from the list below.</div>';
    return;
  }
  mapOK = true;

  map = L.map('map', { zoomControl:true, attributionControl:true })
         .setView([38.34,-115.72], 10);

  L.tileLayer('https://basemap.nationalmap.gov/arcgis/rest/services/USGSTopo/MapServer/tile/{z}/{y}/{x}', {
    maxZoom:16, minZoom:8,
    attribution:'USGS The National Map'
  }).addTo(map);

  // edges as faint lines
  EDGES.forEach(([a,b])=>{
    lines.push(L.polyline([[N[a].lat,N[a].lon],[N[b].lat,N[b].lon]],
      { color:'#7a7268', weight:1, opacity:0.35, dashArray:'3,5' }).addTo(map));
  });

  NODES.forEach(n=>{
    const m = L.circleMarker([n.lat,n.lon], {
      radius:6, color:'#1c1a16', weight:1,
      fillColor:TERRAIN[n.t].color, fillOpacity:0.9
    }).addTo(map);
    m.on('click', ()=> onMarkerClick(n.id));
    markers[n.id] = m;
  });

  hereRing = L.circleMarker([N.jeep.lat,N.jeep.lon],
    { radius:13, color:'#8b3a2a', weight:2, fill:false }).addTo(map);
}

function refreshMap(){
  if(!mapOK || !player) return;
  const here = player.at;
  const near = ADJ[here] || [];
  NODES.forEach(n=>{
    const m = markers[n.id];
    if(!m) return;
    const isHere = n.id===here;
    const isNear = near.indexOf(n.id)!==-1;
    const seen   = !!player.visited[n.id];
    const spot   = !!player.spotted[n.id];
    m.setStyle({
      radius: isHere?8 : isNear?7 : 5,
      fillOpacity: isHere?1 : isNear?0.9 : (seen?0.6 : spot?0.5 : 0.18),
      color: isNear ? '#8b3a2a' : '#1c1a16',
      weight: isNear ? 2 : 1
    });
    const label = (seen||isNear||spot) ? n.name : 'Unvisited ground';
    const dist  = isNear ? '<br>' + km(here,n.id).toFixed(1) + ' km ' + compass(bearing(here,n.id)) +
                           ' \u00b7 ~' + hours(here,n.id).toFixed(1) + ' h on foot' : '';
    m.bindPopup('<b>' + label + '</b><br>' + TERRAIN[n.t].label + ' \u00b7 ' + n.el + ' m' + dist +
                (isNear ? '<br><i>Click again to walk here.</i>' : ''));
  });
  hereRing.setLatLng([N[here].lat, N[here].lon]);
  map.panTo([N[here].lat, N[here].lon], {animate:true});
}

let armed = null;
function onMarkerClick(id){
  if(!player) return;
  if(id === player.at) return;
  if((ADJ[player.at]||[]).indexOf(id) === -1) return;
  if(armed === id){ armed=null; travelTo(id); }
  else { armed = id; }
}

/* ---------------- STATUS + SHEET ---------------- */
function statusFields(){
  if(!player) return [['WATER','\u2014'],['CLOCK','\u2014'],['CONDITION','\u2014']];
  const wcls = player.water <= 2 ? 'int-low' : 'int-val';
  return [
    ['WATER', player.water.toFixed(1) + ' L', wcls],
    ['DAY ' + player.day, clockStr(player.clock) + ' \u00b7 ' + temp() + '\u00b0C'],
    ['CONDITION', condition().toUpperCase(), condition()==='ok'?'int-val':'int-low']
  ];
}
function sheetHTML(){
  if(!player) return '';
  const seen = Object.keys(player.visited).length;
  const unreached = Object.keys(player.spotted).filter(id=>!player.visited[id]).map(id=>N[id].name);
  const t = TERRAIN[N[player.at].t];
  const rows = (ADJ[player.at]||[]).map(id=>{
    const k = knows(id);
    return '<tr><td style="padding:2px 10px 2px 0;">' + (k ? N[id].name : 'unknown ground') + '</td>' +
    '<td style="padding:2px 10px 2px 0; color:var(--rust);">' + (k ? km(player.at,id).toFixed(1)+' km' : vagueDistance(km(player.at,id))) + '</td>' +
    '<td style="padding:2px 10px 2px 0; color:var(--stone);">' + compass(bearing(player.at,id)) + '</td>' +
    '<td style="padding:2px 0; color:var(--stone);">' + (k ? '~'+ (hours(player.at,id)/paceFactor()).toFixed(1) +' h' : '\u2014') + '</td></tr>';
  }).join('');
  const bar = (v)=>{ const n=Math.round(v/10); return '\u2588'.repeat(n) + '\u2591'.repeat(10-n); };
  return '<div class="sheetMeta">' +
    'Water <b>' + player.water.toFixed(1) + ' L</b> &nbsp; Heat strain <b>' + bar(player.core) + '</b> &nbsp; Feet <b>' + bar(player.feet) + '</b><br>' +
    'Drinking about <b>' + drinkRate('walk').toFixed(2) + ' L/h</b> walking, <b>' + drinkRate('shade').toFixed(2) + ' L/h</b> in shade, at ' + temp() + '\u00b0C<br>' +
    'Shade here: <b>' + shadeHere() + '</b> &nbsp;\u00b7&nbsp; Chance of being found: <b>' + rescueLabel() + '</b><br>' +
    '<span style="color:var(--stone);">\u2500\u2500\u2500</span><br>' +
    'Standing on: <b>' + t.label + '</b> at <b>' + N[player.at].el + ' m</b><br>' +
    '<span style="color:var(--stone);">' + t.blurb + '</span><br>' +
    'Ground covered: <b>' + player.walked.toFixed(1) + ' km</b> over <b>' + player.legs + '</b> legs \u00b7 ' +
    'places reached: <b>' + seen + ' / ' + NODES.length + '</b><br>' +
    'Visibility from here: <b>' + seeingRange() + ' km</b> for anything tall' +
    (unreached.length ? '<br>Spotted, not reached: <b>' + unreached.join(', ') + '</b>' : '') +
    '<div style="margin-top:10px; padding-top:8px; border-top:1px solid var(--mist);">' +
      '<div style="font-size:0.55rem; letter-spacing:0.12em; text-transform:uppercase; color:var(--stone); margin-bottom:5px;">From here</div>' +
      '<table style="font-family:\'DM Mono\',monospace; font-size:0.62rem;">' + rows + '</table>' +
    '</div>' +
  '</div>';
}


/* ---------------- BEING FOUND ----------------
   The whole argument of the game lives in these numbers.
   Search and rescue finds vehicles. It does not find people.  */
function shadeHere(){
  const t = N[player.at].t;
  if(player.at === 'jeep') return 'good';          // the vehicle itself
  if(t === 'mine' || t === 'ruin') return 'good';
  if(t === 'wash' || t === 'ridge') return 'some'; // a cutbank, a boulder
  return 'none';                                   // playa, bajada: nothing
}
function rescueChancePerHour(){
  const id = player.at;
  const n = N[id];
  // A parked vehicle is a target an aircraft can actually see.
  if(id === 'jeep'){
    return Math.min(0.20, player.searchHeat * 0.0045);
  }
  // Roads depend on traffic, not on anyone looking for you.
  if(n.t === 'road'){
    if(id === 'us6')    return 0.34;
    if(id === 'graded') return 0.055;
    return 0.010;                                   // two-tracks
  }
  // Out in the country, essentially nobody.
  return 0.0008 + Math.min(0.006, player.searchHeat * 0.00012);
}
function rescueLabel(){
  const p = rescueChancePerHour();
  if(p >= 0.25) return 'good';
  if(p >= 0.05) return 'fair';
  if(p >= 0.012) return 'poor';
  if(p >= 0.004) return 'faint';
  return 'none';
}
function rollRescue(hours){
  const p = rescueChancePerHour();
  const miss = Math.pow(1 - p, hours);
  return Math.random() > miss;
}

/* ---------------- REST ---------------- */
function restFor(h, mode){
  const shade = (mode === 'shade');
  player.shaded = shade;
  const before = player.day;
  advance(h, shade ? 'shade' : 'rest');
  const found = rollRescue(h);
  Engine.log('Waited ' + h + ' h' + (shade?' in shade':'') + ' \u2014 ' +
             clockStr(player.clock) + ', ' + temp() + '\u00b0C, ' +
             player.water.toFixed(1) + ' L left.', 'l-info');
  if(checkDead()) return;
  if(found) return Engine.go(()=>rescued(mode));
  Engine.go(arrive);
}

function checkDead(){
  if(player.core >= 100){ player.dead='heat';   Engine.go(()=>ending()); return true; }
  if(player.dry  >= 9)  { player.dead='thirst'; Engine.go(()=>ending()); return true; }
  return false;
}

/* ---------------- SCENES ---------------- */
function arrive(){
  Engine.badge(player.at==='jeep' ? 'THE JEEP' : 'DAY ' + player.day);
  const n = N[player.at];
  const t = TERRAIN[n.t];
  const near = ADJ[player.at] || [];
  const found = spotFrom();
  const T = temp();
  const night = isNight(player.clock);
  const shade = shadeHere();

  // The country reads differently depending on how bad things are.
  const cond = condition();
  const bodyLine =
    cond === 'critical' ? '<div class="story"><span class="danger">The water is gone.' +
      (player.dry > 5 ? ' You have stopped sweating, which is the sign everyone misreads as improvement.'
                      : ' Everything from here runs on a clock you cannot read.') + '</span></div>' :
    cond === 'bad'      ? '<div class="story"><span class="danger">Head pounding, mouth thick, and the light has gone hard at the edges.</span></div>' :
    cond === 'poor'     ? '<div class="story">Thirsty in the way that stops being a sensation and becomes a fact about you.</div>' :
    cond === 'worn'     ? '<div class="story">Feet complaining. Otherwise holding.</div>' : '';

  const heatWarn = (!night && T >= 34 && shade === 'none')
    ? '<div class="story"><span class="danger">No shade here and it is ' + T + '\u00b0C. Standing still in this costs almost as much as walking.</span></div>' : '';

  const opts = near.map(id=>{
    const known = knows(id);
    const h = hours(player.at,id)/paceFactor();
    const cost = drinkRate('walk') * h;
    const dir = compass(bearing(player.at,id));
    const risk = (night && !known && N[id].t!=='road' && N[player.at].t!=='ridge')
      ? ' \u00b7 easy to miss in the dark' : '';

    if(known){
      return '<button class="choice" data-go="' + id + '">' +
        '<span class="tag">' + dir + ' \u00b7 ' + km(player.at,id).toFixed(1) + ' km \u00b7 ~' +
          h.toFixed(1) + ' h \u00b7 ~' + cost.toFixed(1) + ' L' + risk + '</span>' +
        N[id].name + (player.visited[id] ? '' : ' \u2014 spotted from a distance') +
        '</button>';
    }
    // Unknown ground: a heading, a surface, and a guess.
    const surface = N[id].t === 'road'
      ? (N[player.at].t === 'road' ? 'The track runs on this way' : 'A vehicle track')
      : 'Open ' + TERRAIN[N[id].t].label;
    return '<button class="choice" data-go="' + id + '">' +
      '<span class="tag">' + dir + ' \u00b7 ' + vagueDistance(km(player.at,id)) + risk + '</span>' +
      surface + ' \u2014 you have not been that way' +
      '</button>';
  }).join('');

  const restOpts =
    (shade !== 'none'
      ? '<button class="choice" data-rest="shade4"><span class="tag">SHADE UP \u00b7 4 h \u00b7 ~' +
          (drinkRate('shade')*4).toFixed(1) + ' L</span>Get out of the sun and do nothing. It is not doing nothing.</button>'
      : '<button class="choice" data-rest="rest2"><span class="tag">SIT \u00b7 2 h \u00b7 ~' +
          (drinkRate('rest')*2).toFixed(1) + ' L</span>No shade here worth the name. Rest anyway.</button>') +
    '<button class="choice" data-rest="night"><span class="tag">WAIT FOR DARK / FOR LIGHT \u00b7 ~' +
      (night ? 'until 05:30' : 'until 20:00') + '</span>Sit out the part of the day that kills people.</button>';

  Engine.render(
    (n.note ? '<div class="hereNote">' + n.note + '</div>' : '') +
    spotLine(found) +
    '<div class="story"><b>' + n.name + '</b> \u2014 ' + t.label + ', ' + n.el + ' m. ' +
      lightWord() + ', ' + T + '\u00b0C.</div>' +
    bodyLine + heatWarn +
    '<div class="thought">' + t.blurb + '</div>' +
    (player.at==='jeep' && player.day>=2
      ? '<div class="legline">Day ' + player.day + '. Somebody has noticed by now that you did not come back. ' +
        'Chance of being spotted here: <b>' + rescueLabel() + '</b>.</div>' : '') +
    '<div class="story" style="font-size:0.82rem; color:var(--stone);">Move, or wait.</div>' +
    '<div class="choices">' + restOpts + opts + '</div>'
  );
  document.querySelectorAll('#main .choice').forEach(b=>{
    if(b.dataset.go)   b.onclick = ()=> travelTo(b.dataset.go);
    if(b.dataset.rest) b.onclick = ()=> doRest(b.dataset.rest);
  });
  refreshMap();
}

function doRest(kind){
  if(kind === 'shade4') return restFor(4, 'shade');
  if(kind === 'rest2')  return restFor(2, 'rest');
  // wait out the heat, or wait out the dark
  const t = (player.clock % 24 + 24) % 24;
  let h;
  if(isNight(player.clock)) h = (t >= 20 ? (24 - t) + 5.5 : 5.5 - t);
  else                      h = 20 - t;
  h = Math.max(0.5, Math.round(h*10)/10);
  return restFor(h, shadeHere() !== 'none' ? 'shade' : 'rest');
}

function travelTo(id){
  const from = player.at;
  const d = km(from,id);
  const h = hours(from,id) / paceFactor();
  const night = isNight(player.clock);
  const known = !!player.visited[id];

  // Walking at night is correct — far less water — but finding an
  // unvisited point in the dark on open ground is a different job.
  let lost = false;
  if(night && !known && N[id].t !== 'road'){
    const anchor = N[from].t === 'ridge' || player.spotted[id];
    if(!anchor && Math.random() < 0.35) lost = true;
  }

  advance(h, 'walk');
  player.legs += 1;
  player.walked += d;

  if(lost){
    // You did not arrive. You spent the hours anyway.
    const back = Engine.pick(ADJ[from].filter(x=>x!==id).concat([from]));
    player.at = back;
    player.visited[back] = true;
    Engine.log('Lost the line in the dark. ' + d.toFixed(1) + ' km walked, nowhere useful.', 'l-bad');
    Engine.sfxFail();
    if(checkDead()) return;
    return Engine.go(()=>strayed(id, back, h));
  }

  player.at = id;
  player.visited[id] = true;
  Engine.log('Walked ' + d.toFixed(1) + ' km ' + compass(bearing(from,id)) + ' to ' + N[id].name +
             ' \u2014 ' + h.toFixed(1) + ' h, ' + player.water.toFixed(1) + ' L left.', 'l-info');
  if(checkDead()) return;
  if(rollRescue(h)) return Engine.go(()=>rescued('walk'));
  Engine.go(arrive);
}

function strayed(intended, actual, h){
  Engine.badge('LOST');
  Engine.render(
    '<div class="hereNote">You walked ' + h.toFixed(1) + ' hours on a bearing you were sure of, and the ground did not match. ' +
    'No landmark, no lights, and the range you were using to steer by went black an hour ago.</div>' +
    '<div class="story">When the sky greys enough to read the country, you are at <b>' + N[actual].name + '</b>. ' +
    'Not ' + N[intended].name + '. The water is gone regardless.</div>' +
    '<div class="thought">This is the part nobody tells you about walking at night. The cool is real and the savings are real, and none of it helps if you arrive somewhere else.</div>' +
    Engine.contBtn()
  );
  Engine.wire(arrive);
}

/* ---------------- ENDINGS ---------------- */
function rescued(how){
  player.saved = how;
  const id = player.at;
  let text;
  if(id === 'jeep'){
    text = "A Civil Air Patrol Cessna comes up the valley at maybe six hundred feet, following the two-track because that is what you follow when you are looking for a vehicle. It banks once, comes back lower, and waggles its wings. " +
           "It found the Jeep. It was never going to find you.";
  } else if(N[id].t === 'road'){
    text = "A truck. Actual dust on the horizon resolving into an actual truck, and it slows, and the window comes down, and a rancher who is not remotely surprised to see you asks if you are the one with the Jeep.";
  } else {
    text = "A white pickup with no markings comes over the rise and stops thirty metres off. Two men get out. They give you water before they ask you anything, which you appreciate, and then they ask you a number of things, and then they drive you to a gate and have you sign a form about what you did and did not see.";
  }
  Engine.recordEnding('rescued-' + (id === 'jeep' ? 'vehicle' : N[id].t === 'road' ? 'road' : 'other'),
    {day:player.day, water:+player.water.toFixed(1), walked:+player.walked.toFixed(1), at:id});
  Engine.sfxSuccess();
  Engine.badge('FOUND');
  Engine.render(
    '<div class="story"><span class="flavor">FOUND \u2014 DAY ' + player.day + ', ' + clockStr(player.clock) + '</span></div>' +
    '<div class="story">' + text + '</div>' + manifest() +
    '<button class="smallbtn primary-go" id="again">ANOTHER TRIP \u2192</button>'
  );
  document.getElementById('again').onclick = ()=>Engine.restart();
}

function ending(){
  const how = player.dead;
  const far = km('jeep', player.at);
  let text;
  if(how === 'thirst'){
    text = "The water ran out " + (far < 1 ? "at the Jeep" : far.toFixed(1) + " kilometres from the Jeep") +
           " and there was nothing between here and anywhere. It is not dramatic. You get slower, and then you get confused, and the confusion is the part that finishes it.";
  } else {
    text = "Core temperature is the one that gets people who think thirst is the danger. You stopped sweating an hour ago and took that as good news.";
  }
  const lesson = (player.at === 'jeep')
    ? "You stayed. That was right. The margin was simply not there \u2014 nine litres and a valley this size is a hard arithmetic problem no matter how well you play it."
    : "The Jeep is " + far.toFixed(1) + " km back that way, with shade, and a mirror, and a shape an aircraft can see from six hundred feet.";
  Engine.recordEnding('lost-' + how, {day:player.day, walked:+player.walked.toFixed(1), at:player.at});
  Engine.sfxFail();
  Engine.badge('END');
  Engine.render(
    '<div class="story"><span class="danger">DAY ' + player.day + ', ' + clockStr(player.clock) + '</span></div>' +
    '<div class="story">' + text + '</div>' +
    '<div class="thought">' + lesson + '</div>' + manifest() +
    '<button class="smallbtn primary-go" id="again">ANOTHER TRIP \u2192</button>'
  );
  document.getElementById('again').onclick = ()=>Engine.restart();
}

function manifest(){
  return '<div style="border:1px solid var(--mist); background:var(--cream); padding:12px 14px; margin:18px 0; font-family:\'DM Mono\',monospace; font-size:0.64rem; line-height:1.8;">' +
    '<div style="font-size:0.56rem; letter-spacing:0.12em; text-transform:uppercase; color:var(--stone); margin-bottom:8px;">Trip log</div>' +
    'Days out: <b style="color:var(--ink);">' + player.day + '</b><br>' +
    'On foot: <b style="color:var(--ink);">' + player.walked.toFixed(1) + ' km</b> over ' + player.legs + ' legs<br>' +
    'Water remaining: <b style="color:var(--ink);">' + player.water.toFixed(1) + ' L</b><br>' +
    'Furthest from the Jeep: <b style="color:var(--ink);">' + km('jeep', player.at).toFixed(1) + ' km</b><br>' +
    'Places reached: <b style="color:var(--ink);">' + Object.keys(player.visited).length + ' / ' + NODES.length + '</b>' +
    '<div style="margin-top:8px; padding-top:8px; border-top:1px solid var(--mist); color:var(--stone);">' +
      'Trips taken: <b style="color:var(--ink);">' + Engine.runCount() + '</b>' +
    '</div></div>';
}

/* ---------------- LAUNCH ---------------- */
Engine.init({
  id: 'stay-with-the-vehicle',
  title: 'STAY WITH THE VEHICLE',
  subtitle: 'Railroad Valley, Nye County, Nevada \u00b7 terrain build',
  accent: 'var(--rust)',
  mode: 'over',
  sheetLabel: 'TERRAIN',
  lockBackOn: [],
  state: ()=>{ player = freshState(); return player; },
  status: statusFields,
  sheet: sheetHTML,
  panel: buildMap,
  panelUpdate: refreshMap,
  start: arrive
});
</script>
</body>
</html>
