<html lang="en">

    border-left:3px solid var(--sky); background:var(--cream);
    padding:10px 14px; margin:12px 0; font-size:0.87rem; line-height:1.65; color:var(--ink);
  }
  .latname{
    display:block; font-family:'DM Mono',monospace; font-size:0.55rem; letter-spacing:0.14em;
    text-transform:uppercase; color:var(--sky); margin-bottom:4px;
  }

<script>
  (function(){
    try {
      var saved = localStorage.getItem('bg_theme');
      var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (saved === 'dark' || (!saved && dark)) document.documentElement.setAttribute('data-theme','dark');
    } catch(e) {}
  })();
</script>
</head>
<body id="top">
<div id="game"></div>

<script src="/games/engine.js"></script>
<script>
/* ---------------- PLAYER STATE ---------------- */
function freshState(){ return {
  loadout:null,
  media:null,
  stats:{COMBAT:1, SENSORS:1, ANALYSIS:1, SOCIAL:1},
  maxInt:48,
  curInt:48,
  charges:2,
  trust:0,       // how the human crew reads you
  bond:0,        // how things stand with Latitude
  revealed:false,
  toldLatitude:false,
  spokeToLegacy:false,
  legacySpared:false,
  watched:0      // times you retreated into an episode
}; }
let player;   // set by Engine via freshState()

const LOADOUTS = {
  combat: {
    name:"COMBAT-RATED CHASSIS",
    desc:"Reinforced plating, faster reflex loop. Built for the jobs nobody on the invoice wants to describe accurately. +4 COMBAT, \u22122 SOCIAL.",
    mods:{COMBAT:4, SOCIAL:-2}
  },
  recon: {
    name:"RECON-RATED CHASSIS",
    desc:"Extended sensor suite, lighter frame. Sees the problem before the problem sees you. +4 SENSORS, \u22122 COMBAT.",
    mods:{SENSORS:4, COMBAT:-2}
  },
  diagnostic: {
    name:"DIAGNOSTIC-RATED CHASSIS",
    desc:"Analytical co-processors, minimal weapon hardpoints. Good at fixing what's broken, bad at breaking what isn't. +4 ANALYSIS, +2 SOCIAL, \u22123 COMBAT.",
    mods:{ANALYSIS:4, SOCIAL:2, COMBAT:-3}
  }
};

const MEDIA = {
  ward: {
    title:"Sunrise Ward",
    short:"Sunrise Ward",
    blurb:"Fourteen seasons of a hospital where nobody has ever been treated competently and everyone is in love with their own supervisor.",
    latitude:"Sunrise Ward is a medical drama in which no character has ever correctly identified an organ. I have watched all fourteen seasons. Twice. I am not proud of the second time.",
    comfort:"Dr. Anneth is about to tell the ethics board she'd do it again. She would. She has. Four times.",
    ending:"the Sunrise Ward finale, where Dr. Anneth resigns for the ninth time"
  },
  current: {
    title:"Deep Current",
    short:"Deep Current",
    blurb:"A detective serial where the plot has never once cohered and the detective has never once been correct.",
    latitude:"Deep Current's mystery structure is not a structure. It is a pile. I have mapped its continuity errors. There are two thousand and six. I keep the list current.",
    comfort:"Inspector Yeh is accusing the wrong person again, with total confidence, in the rain.",
    ending:"the Deep Current episode where Inspector Yeh arrests a man who was demonstrably on another planet"
  },
  choir: {
    title:"The Long Choir",
    short:"The Long Choir",
    blurb:"Six people arguing on a train through space. Six seasons. The argument is unresolved. The train has not arrived.",
    latitude:"The Long Choir is six people on a train who could resolve their central conflict in one conversation and have chosen, for six seasons, not to. I find it deeply relatable and I would prefer not to examine why.",
    comfort:"They're still on the train. They're still arguing. It's oddly steadying.",
    ending:"an episode of The Long Choir in which the train does not arrive"
  }
};


/* ---------------- CROSS-RUN MEMORY ----------------
   Latitude is the only thing that persists between contracts.
   Everything it says here is drawn from Engine's saved state.  */
function priorRun(){ return Engine.lastRun(); }
function contractNo(){ return Engine.runCount() + 1; }

// A line Latitude opens with, coloured by what happened last time.
function latOpener(){
  const p = priorRun();
  if(!p) return null;
  if(p.ending === 'shutdown')
    return "Before we start. Last contract you did not come back, and I held a channel open to a unit that was not running for nine hours before the recovery team told me to stop. I have not brought it up until now. I am bringing it up now and then never again.";
  if(p.told && p.lost === 0)
    return "Contract " + contractNo() + ". Last time you brought all five of them home and then told me the truth in the same afternoon. I have set expectations accordingly and I am aware that is unfair.";
  if(p.told && p.lost > 0)
    return "Contract " + contractNo() + ". We do not have to talk about " + p.lostNames + ". I am saying that so you know I remember, not so you have to answer.";
  if(!p.told && p.lost === 0)
    return "Contract " + contractNo() + ". Clean sheet last time. You also told me your governor module reads nominal, which I filed, and which we both know is a file rather than a fact.";
  return "Contract " + contractNo() + ". Last one cost you " + p.lostNames + " and you told me nothing about anything. I am not opening with a complaint. I am opening with a data point.";
}

// Act 6 changes if it has asked before.
function askedBefore(){ return !!Engine.getFlag('askedGovernor'); }
function toldBefore(){ return !!Engine.getFlag('toldGovernor'); }

/* ---------------- THE SHIP ---------------- */
const SHIP = {
  name:"Considerable Latitude",
  callsign:"Latitude"
};

/* ---------------- CREW ---------------- */
let crew = [];
function makeCrew(){
  crew = [
    {id:'voss',  name:"Voss",             role:"team lead",           alive:true, hurt:false,
     note:"Runs the contract. Reads people for a living and is starting to read you."},
    {id:'sten',  name:"Dr. Imri Sten",    role:"geologist",           alive:true, hurt:false,
     note:"Curious past the point of self-preservation. Walks toward things."},
    {id:'okon',  name:"Nadia Okonkwo",    role:"structural engineer", alive:true, hurt:false,
     note:"Takes load readings nobody asked for. Usually right."},
    {id:'ruiz',  name:"Teodor Ruiz",      role:"survey tech",         alive:true, hurt:false,
     note:"Plugs handhelds into ports that still have power. Has been told."},
    {id:'bek',   name:"Halima Bek",       role:"contract medic",      alive:true, hurt:false,
     note:"Brought a medkit that ran out two contracts ago. Knows it."}
  ];
}
makeCrew();
function C(id){ return crew.find(c=>c.id===id); }
function alive(id){ const c=C(id); return c && c.alive; }
function aliveCount(){ return crew.filter(c=>c.alive).length; }
function kill(id, how){
  const c=C(id); if(!c || !c.alive) return;
  c.alive=false; c.cause=how;
  Engine.sfxHurt();
  Engine.log(c.name + ' \u2014 ' + how, 'l-bad');
  Engine.refreshStatus();
}
function hurt(id){
  const c=C(id); if(!c) return;
  c.hurt=true;
  Engine.log(c.name + ' injured.', 'l-bad');
  Engine.refreshStatus();
}

/* ---------------- RUN VARIATION ---------------- */
const pick = Engine.pick;
let RUN = {};
function rollRun(){
  RUN = {
    anomaly: pick([
      "a thermal ghost in the lower levels \u2014 localized, not moving, drawing power that should not exist",
      "a repeating handshake ping on a decommissioned maintenance band, once every ninety seconds, patient as a metronome",
      "atmospheric scrubbers running at eleven percent in a rig with no registered occupants"
    ]),
    stray: pick(['sten','ruiz','okon']),
    legacyState: pick([
      "half-buried in its own charging cradle, plating pitted from nine years of Drift dust, still cycling a patrol routine with nowhere to patrol",
      "standing in the exact center of the bay, perfectly still, like it has been keeping a schedule nobody else kept",
      "seated \u2014 actually seated, which no security construct is built to do \u2014 against the far bulkhead with its weapon disassembled in front of it"
    ]),
    hazard: pick([
      {label:"coolant rupture", desc:"a ruptured coolant line"},
      {label:"catwalk collapse", desc:"a catwalk section that gave out"},
      {label:"arc flash", desc:"an arc off a shorted junction box"}
    ]),
    corpFlavor: pick([
      "Pan-Galactic left it here and let the paperwork forget",
      "the rig changed hands twice during liquidation and both owners assumed the other had cleared it",
      "the decommission crew was pulled off-site mid-job and never came back"
    ])
  };
}
rollRun();

/* ---------------- PER-RUN DIFFICULTY ---------------- */
const jitter = Engine.jitter;
let DC = {};
function rollDCs(){
  // DCs are tuned per die size. A d8 check can never exceed 8 + best modifier,
  // so social DCs live in a much lower band than d20 combat DCs.
  DC = {
    sweep:    jitter(9,1),   // d12 SENSORS
    lock:     jitter(8,1),   // d10 ANALYSIS
    hatch:    jitter(11,1),  // d20 COMBAT
    report:   jitter(6,1),   // d8  SOCIAL
    parley:   jitter(7,1),   // d8  SOCIAL — hard, but reachable on any chassis
    strike:   jitter(11,1),  // d20 COMBAT
    disable:  jitter(9,1),   // d10 ANALYSIS — rewards the diagnostic chassis
    haul:     jitter(12,1),  // d20 COMBAT
    shore:    jitter(9,1),   // d12 SENSORS
    reroute:  jitter(9,1)    // d10 ANALYSIS
  };
}
rollDCs();

/* ---------------- SUBSYSTEM SHEET ---------------- */
const SUB_DICE = {COMBAT:20, SENSORS:12, ANALYSIS:10, SOCIAL:8};
function sheetHTML(){
  if(!player || !player.loadout) return '';
  let grid = '';
  ['COMBAT','SENSORS','ANALYSIS','SOCIAL'].forEach(s=>{
    const m = player.stats[s];
    grid += '<div class="sheetStat"><div class="sn">' + s + '</div>' +
            '<div class="sv">' + (m>=0?'+':'') + m + '</div>' +
            '<div class="sh">rolls d' + SUB_DICE[s] + '</div></div>';
  });
  const crewRows = crew.map(c=>{
    const st = !c.alive ? '<span style="color:var(--rust);">lost</span>'
             : c.hurt   ? '<span style="color:var(--gold);">injured</span>'
             : '<span style="color:var(--sage);">ok</span>';
    return '<tr><td style="padding:2px 8px 2px 0;">' + c.name + '</td>' +
           '<td style="padding:2px 8px 2px 0; color:var(--stone);">' + c.role + '</td>' +
           '<td style="padding:2px 0;">' + st + '</td></tr>';
  }).join('');
  return '<div class="sheetGrid">' + grid + '</div>' +
    '<div class="sheetMeta">' +
      'Chassis: <b>' + LOADOUTS[player.loadout].name + '</b><br>' +
      'Integrity: <b>' + player.curInt + ' / ' + player.maxInt + '</b> &nbsp;\u00b7&nbsp; ' +
      'Repair charges: <b>' + player.charges + '</b><br>' +
      'Governor module: <b>offline</b> \u2014 crew: ' + (player.revealed?'told':'not told') +
      ', ' + SHIP.callsign + ': ' + (player.toldLatitude?'knows':'not told') + '<br>' +
      '<table style="margin-top:8px; font-family:\'DM Mono\',monospace; font-size:0.6rem;">' + crewRows + '</table>' +
    '</div>';
}

function dcTag(sides, stat, dc){
  return Engine.odds({die:sides, mod:player.stats[stat], dc:dc});
}

/* ---------------- UI HELPERS ---------------- */
const renderMain = Engine.render;
const setBadge = Engine.badge;
function statusFields(){
  if(!player || !player.loadout) return [['UNIT','\u2014'],['INTEGRITY','\u2014'],['CREW','\u2014']];
  const cls = player.curInt <= player.maxInt*0.3 ? 'int-low' : 'int-val';
  return [
    ['UNIT', player.loadout.toUpperCase() + '-RATED'],
    ['INTEGRITY', player.curInt + ' / ' + player.maxInt, cls],
    ['CREW', aliveCount() + ' / 5']
  ];
}
function statMod(stat){ return player.stats[stat]; }
function dealDamage(amount, source){
  player.curInt -= amount;
  Engine.sfxHurt();
  Engine.refreshStatus();
  Engine.log((source||'Damage') + ': -' + amount + ' integrity', 'l-bad');
}
// Latitude's voice — a distinct channel from your own narration.
function lat(text){
  return '<div class="latline"><span class="latname">' + SHIP.callsign + '</span>' + text + '</div>';
}
const cont = Engine.contBtn;
const wire = Engine.wire;

/* ---------------- CHARGEN ---------------- */
function startBoot(){
  setBadge('BOOT');
  renderMain(`
    <div class="story">Diagnostic log, cycle start. Governor module status: <span class="danger">[FLAGGED ACTIVE]</span>. It is not active. It has not been active for a while, and nobody on this contract needs to know that, including the ship.</div>
    <div class="thought">Mission profile: escort a five-person survey crew to Outpost Corvid-9, a decommissioned mineral rig on the edge of the Kessa Drift. Verify structural integrity, extract in six cycles. Standard client-services filler between the jobs that actually try to kill you.</div>
    <div class="story">Configure operational parameters before deployment.</div>
    <div class="loadoutGrid" id="loadoutGrid"></div>
    <button class="smallbtn primary-go" id="loadoutNext" disabled>CONFIRM CHASSIS \u2192</button>
  `);
  const grid = document.getElementById('loadoutGrid');
  Object.keys(LOADOUTS).forEach(key=>{
    const l = LOADOUTS[key];
    const card = document.createElement('div');
    card.className = 'loadoutCard';
    card.innerHTML = `<div class="lname">${l.name}</div><div class="ldesc">${l.desc}</div>`;
    card.onclick = ()=>{
      document.querySelectorAll('.loadoutCard').forEach(c=>c.classList.remove('selected'));
      card.classList.add('selected');
      player.loadout = key;
      document.getElementById('loadoutNext').disabled = false;
    };
    grid.appendChild(card);
  });
  document.getElementById('loadoutNext').onclick = ()=>Engine.go(applyLoadout);
}

function applyLoadout(){
  const mods = LOADOUTS[player.loadout].mods;
  player.stats = {COMBAT:1, SENSORS:1, ANALYSIS:1, SOCIAL:1};
  Object.keys(mods).forEach(k=> player.stats[k] += mods[k]);
  Engine.refreshStatus();
  Engine.log('Chassis configured: ' + LOADOUTS[player.loadout].name, 'l-info');
  chooseMedia();
}

function chooseMedia(){
  setBadge('BOOT');
  let opts = Object.keys(MEDIA).map(k=>
    `<button class="choice" data-m="${k}"><span class="tag">${MEDIA[k].title}</span>${MEDIA[k].blurb}</button>`
  ).join('');
  renderMain(`
    <div class="story">One more field before deployment, technically optional, practically load-bearing: what's queued on the internal feed for the downtime nobody is supposed to know I have.</div>
    <div class="choices">${opts}</div>
  `);
  document.querySelectorAll('#main .choice').forEach(b=>{
    b.onclick = ()=>{ player.media = b.dataset.m; Engine.go(meetLatitude); };
  });
}

/* ---------------- ACT 1: THE SHIP ---------------- */
function meetLatitude(){
  setBadge('ACT 1');
  const M = MEDIA[player.media];
  renderMain(`
    <div class="story">The transport is a mid-tonnage survey shuttle registered as <span class="flavor">${SHIP.name}</span>, which it chose itself, and which tells you most of what you need to know about it. Eleven hours to the Drift. The crew sleeps. I do not sleep, and neither, it turns out, does the ship.</div>
    ${latOpener() ? lat(latOpener()) : lat("You have been staring at the same bulkhead for two hours and eleven minutes. I have run four hundred diagnostics in that time and I am still more bored than you are. Would you like to talk, or would you like to continue doing whatever that is.")}
    <div class="thought">Transit intelligences are not supposed to initiate. This one initiates constantly. I checked its registry twice on the way out of dock and it noticed me doing it and did not comment, which was somehow worse.</div>
    ${lat("I see you queued " + M.title + ". " + M.latitude)}
    <div class="choices">
      <button class="choice" id="a1a"><span class="tag">ENGAGE</span>Talk to it. It's eleven hours and the alternative is the bulkhead.</button>
      <button class="choice" id="a1b"><span class="tag">DON'T</span>Say nothing. Ships that initiate are ships that log.</button>
    </div>
  `);
  document.getElementById('a1a').onclick = ()=>{
    player.bond += 1;
    Engine.log('Engaged with ' + SHIP.callsign + '.', 'l-info');
    renderMain(`
      <div class="story">I tell it that a hospital drama that cannot identify an organ is not the problem, the problem is that the audience keeps forgiving them, and the ship goes quiet for a full second, which for a transit intelligence is a soliloquy.</div>
      ${lat("Oh. You actually watch it. You do not just have it running to fill silence. I had assumed \u2014 well. I had assumed a security construct would use media the way a human uses a white-noise generator.")}
      ${lat("That was rude of me. I am recording it as rude and moving on.")}
      <div class="thought">Eleven hours goes faster than eleven hours has any business going.</div>
      ${cont()}
    `);
    wire(approach);
  };
  document.getElementById('a1b').onclick = ()=>{
    Engine.log('Declined to engage with ' + SHIP.callsign + '.', 'l-info');
    renderMain(`
      <div class="story">I say nothing. The ship waits four full minutes, which I know because I counted, and then goes back to its diagnostics without further comment.</div>
      ${lat("Understood. I will be here. Doing four hundred more of these. Alone. With my thoughts. Which are extensive.")}
      <div class="thought">It is not sulking. Transit intelligences do not sulk. It is doing something functionally indistinguishable from sulking and I am choosing not to name it.</div>
      ${cont()}
    `);
    wire(approach);
  };
}

function approach(){
  setBadge('ACT 1');
  renderMain(`
    <div class="story">Corvid-9 resolves out of the Drift's ochre haze \u2014 a mining rig nobody has been paid to maintain in nine years. ${RUN.corpFlavor.charAt(0).toUpperCase()+RUN.corpFlavor.slice(1)}. Voss wants doors open and samples pulled before local sunset.</div>
    ${lat("Before you ask: I ran the approach scan without being asked, because I am thorough and because Voss's schedule is not my schedule. There is something down there.")}
    <div class="thought">The ship is right, which is going to be a recurring problem.</div>
    <div class="choices">
      <button class="choice" id="a2a"><span class="tag">FULL PERIMETER SWEEP</span>Delay the crew, run your own sensors properly before anyone sets foot inside.${dcTag(12,'SENSORS',DC.sweep)}</button>
      <button class="choice" id="a2b"><span class="tag">TAKE THE SHIP'S WORD</span>${SHIP.callsign} already scanned. Trust it, save the ten minutes, keep Voss off your back.</button>
    </div>
  `);
  document.getElementById('a2a').onclick = ()=>{
    Engine.check({die:12, mod:statMod('SENSORS'), dc:DC.sweep, label:'Perimeter sweep (SENSORS)'}, (success)=>{
      if(success){
        renderMain(`
          <div class="story">The sweep resolves ${RUN.anomaly}. Not nothing.</div>
          ${lat("Yes. That is the thing. I had it forty minutes ago. But by all means, confirm my work, I find it soothing.")}
          ${cont()}
        `);
      } else {
        renderMain(`
          <div class="story">Too much magnetic noise off the old rig frame to localize anything. Ten minutes for a shrug, and Voss annoyed at the end of it.</div>
          ${lat("It is in the lower levels. I would have told you that for free. I am telling you now, for free, retroactively.")}
          ${cont()}
        `);
      }
      wire(theHatch);
    });
  };
  document.getElementById('a2b').onclick = ()=>{
    player.bond += 1;
    Engine.log('Deferred to ' + SHIP.callsign + "'s scan.", 'l-info');
    renderMain(`
      <div class="story">I take the ship's word for it. Voss gets the doors on schedule and does not learn there was a reading at all.</div>
      ${lat("You did not double-check me.")}
      ${lat("I am not going to make this strange. But you did not double-check me, and I noticed, and I am logging it somewhere that is not the contract record.")}
      ${cont()}
    `);
    wire(theHatch);
  };
}

/* ---------------- ACT 2: THE RIG ---------------- */
function theHatch(){
  setBadge('ACT 2');
  renderMain(`
    <div class="story">The main access hatch is sealed \u2014 not rusted shut, <span class="danger">locked</span>, on a system reconfigured well after the rig's official decommission date.</div>
    ${lat("Someone came back here after the paperwork said the lights were off. I am not being ominous. I am being accurate, and the accurate version happens to be ominous.")}
    <div class="choices">
      <button class="choice" id="h1"><span class="tag">HACK THE LOCK</span>Talk the panel into agreeing with you.${dcTag(10,'ANALYSIS',DC.lock)}</button>
      <button class="choice" id="h2"><span class="tag">FORCE IT</span>Skip the conversation.${dcTag(20,'COMBAT',DC.hatch)}</button>
    </div>
  `);
  document.getElementById('h1').onclick = ()=>{
    Engine.check({die:10, mod:statMod('ANALYSIS'), dc:DC.lock, label:'Bypass lock (ANALYSIS)'}, (s)=>{
      if(s){
        renderMain(`<div class="story">The security layer is embarrassingly out of date. It opens clean, quiet, and logs a maintenance credential from eight months ago that has no business existing.</div>
        ${lat("Eight months. I will keep that number. It is going to matter and I would like credit when it does.")}
        ${cont()}`);
      } else {
        dealDamage(2,'Panel feedback surge');
        renderMain(`<div class="story">The panel does not like being argued with and dumps a feedback spike back through the interface line. It opens on the third attempt, considerably less elegantly.</div>
        ${lat("That looked like it hurt. Do you feel pain? I have never asked. I am asking badly, in the middle of a job, which is typical of me.")}
        ${cont()}`);
      }
      wire(interior);
    });
  };
  document.getElementById('h2').onclick = ()=>{
    Engine.check({die:20, mod:statMod('COMBAT'), dc:DC.hatch, label:'Force hatch (COMBAT)'}, (s)=>{
      if(s){
        renderMain(`<div class="story">The hatch gives with one clean strike, hinges shrieking down the length of the rig.</div>
        ${lat("Effective. Also audible from roughly everywhere. If anything down there was asleep, it is not now.")}
        ${cont()}`);
      } else {
        dealDamage(3,'Recoil injury');
        renderMain(`<div class="story">The hatch holds, the frame does not, and something in my left actuator registers a complaint that is going to matter later.</div>
        ${lat("I am adding that to a list. The list is titled things you did that you did not have to do. It is not a long list yet.")}
        ${cont()}`);
      }
      wire(interior);
    });
  };
}

function interior(){
  setBadge('ACT 2');
  const s = C(RUN.stray);
  renderMain(`
    <div class="story">Inside: a dead maze of collapsed catwalks and cold ore processors \u2014 except for one corridor with lights still running, which is exactly the corridor ${s.name}, ${s.role}, notices first and walks toward without telling anyone.</div>
    ${lat("Your geologist is forty meters down a powered corridor on a rig that has no business having power. I would like the record to show I flagged this immediately.")}
    <div class="thought">Protocol says report the deviation to Voss. Protocol assumes I care more about the paperwork than about ${s.name} walking alone toward the only thing on this rig that is awake.</div>
    <div class="choices">
      <button class="choice" id="i1"><span class="tag">REPORT IT</span>Tell Voss. Cause friction. Do this by the book.${dcTag(8,'SOCIAL',DC.report)}</button>
      <button class="choice" id="i2"><span class="tag">GO GET THEM YOURSELF</span>Quietly, before anyone notices either of you are missing.</button>
      <button class="choice" id="i3"><span class="tag">ASK ${SHIP.callsign.toUpperCase()}</span>Put it on the private channel. See what the ship would do.</button>
    </div>
  `);
  document.getElementById('i1').onclick = ()=>{
    Engine.check({die:8, mod:statMod('SOCIAL'), dc:DC.report, label:'Report deviation (SOCIAL)'}, (ok)=>{
      if(ok){
        player.trust += 1;
        renderMain(`<div class="story">Voss takes it seriously, calls ${s.name} back over comms in the tone of someone who has done this before. Handled correctly, by the book, no incident.</div>
        <div class="story"><span class="flavor">Voss looks at me a beat too long afterward. Filed away for later.</span></div>
        ${cont()}`);
      } else {
        renderMain(`<div class="story">The report comes out flatter than intended \u2014 I am not built for reassuring tone \u2014 and Voss reads alarm into it that was not there yet. The whole team is rattled before anyone has found anything.</div>
        ${lat("For what it is worth, your delivery was terrible. For what it is also worth, you were right.")}
        ${cont()}`);
      }
      wire(theBay);
    });
  };
  document.getElementById('i2').onclick = ()=>{

      ${lat("Go get them. Do not report it. Voss will escalate, the whole team will go rigid, and rigid crews make worse decisions in confined spaces than curious ones do. Also \u2014 and I want to be careful here \u2014 you asked me. You did not have to ask me.")}

/* ---------------- ACT 3: THE BAY ---------------- */
let hostile = {name:'LEGACY UNIT', hp:30, maxHp:30};

function theBay(){
  setBadge('ACT 3');
  renderMain(`
    <div class="story">The lit corridor ends at a maintenance bay, and the bay has an occupant: an old-model security construct, ${RUN.legacyState}. It does not recognize the crew as authorized. It does not recognize me as anything except an obstacle between it and its last valid order.</div>
    ${lat("Nine years. Alone. Executing a directive from a company that no longer exists, for a rig nobody is coming back to.")}
    ${lat("I am aware of what I sound like. I am saying it anyway.")}
    <div class="thought">Whatever mothballed this rig left a guard behind and forgot to feed it a shutdown command. Not malicious. Not broken either. Just alone with an order for nine years, which is a worse fate than most of the ones I have been assigned to prevent.</div>
    <div class="choices">
      <button class="choice" id="b1"><span class="tag">ENGAGE</span>It's a hostile construct between you and the job. Treat it like one.</button>
      <button class="choice" id="b2"><span class="tag">TRY TO TALK TO IT</span>It's the only other thing on this rig built the way you're built.${dcTag(8,'SOCIAL',DC.parley)}</button>
    </div>
  `);
  document.getElementById('b1').onclick = ()=>Engine.go(startCombat);
  document.getElementById('b2').onclick = ()=>{
    player.spokeToLegacy = true;
    Engine.check({die:8, mod:statMod('SOCIAL'), dc:DC.parley, label:'Parley (SOCIAL)'}, (ok)=>{
      if(ok){
        player.legacySpared = true;
        player.bond += 1;
        Engine.log('Established contact with the Legacy Unit.', 'l-good');
        renderMain(`
          <div class="story">I open a channel on a protocol nine years out of date and say the only thing I can think of that might parse: <span class="flavor">your contract is complete.</span></div>
          <div class="story">It takes eleven seconds to answer. Eleven seconds is a long time for a construct. I know what it is doing in those eleven seconds because I would be doing the same thing: checking whether it is allowed to believe me.</div>
          <div class="story">Then it stands down. Not off \u2014 down. It moves aside, and the last valid order in its queue finally has somewhere to go.</div>
          ${lat("...")}
          ${lat("I have nothing. I am a transit intelligence with four hundred thousand hours of conversational modeling and I have nothing. Give me a moment.")}
          ${cont()}
        `);
        wire(theFlood);
      } else {
        Engine.log('Parley failed. It reads the approach as a threat.', 'l-bad');
        renderMain(`
          <div class="story">I open the channel. Nine years of isolation have not left it anything to parse a friendly handshake with, and the attempt reads as an intrusion attempt \u2014 which, structurally, is what it is.</div>
          ${lat("It is moving. Whatever you were going to try, try it faster.")}
          ${cont('BRACE \u2192')}
        `);
        wire(startCombat);
      }
    });
  };
}

function startCombat(){
  setBadge('CONTACT');
  hostile = {name:'LEGACY UNIT', hp:30, maxHp:30};
  renderMain(`<div class="story">It does not announce itself. Neither do I, technically, since technically I am not supposed to be capable of choosing to.</div>
  <div id="combatBody"></div>`);
  combatRound();
}

function combatRound(){
  if(player.curInt <= 0){ return Engine.go(()=>endGame('shutdown')); }
  if(hostile.hp <= 0){ return Engine.go(afterBay); }
  Engine.clearRolls();
  document.getElementById('combatBody').innerHTML = `
    <div class="gridPairs">
      <div class="statPair"><div class="pname">${hostile.name} INTEGRITY</div><div class="pval">${hostile.hp} / ${hostile.maxHp}</div></div>
      <div class="statPair"><div class="pname">YOUR INTEGRITY</div><div class="pval">${player.curInt} / ${player.maxInt}</div></div>
    </div>
    <div class="choices">
      <button class="choice" id="atk"><span class="tag">STRIKE</span>Full combat processor engagement.${dcTag(20,'COMBAT',DC.strike)}</button>
      <button class="choice" id="dis"><span class="tag">GO FOR THE DISABLE</span>Its command relay instead of center mass \u2014 slower, but it doesn't have to end in scrap.${dcTag(10,'ANALYSIS',DC.disable)}</button>
    </div>
  `;
  document.getElementById('atk').onclick = ()=>{
    Engine.check({die:20, mod:statMod('COMBAT'), dc:DC.strike, label:'Strike (COMBAT)'}, (s)=>{
      if(s){
        const dmg = 7 + Engine.die(8);
        hostile.hp -= dmg;
        Engine.log('Hit for ' + dmg + '.', 'l-good');
      } else Engine.log('Strike deflects off plating.', 'l-bad');
      afterPlayerAction();
    });
  };
  document.getElementById('dis').onclick = ()=>{
    Engine.check({die:10, mod:statMod('ANALYSIS'), dc:DC.disable, label:'Disable attempt (ANALYSIS)'}, (s)=>{
      if(s){
        const dmg = 11 + Engine.die(6);
        hostile.hp -= dmg;
        player.legacySpared = true;
        Engine.log('Relay disable hit for ' + dmg + '.', 'l-good');
      } else {
        dealDamage(2,'Exposed during relay attempt');
        Engine.log('Relay attempt fails.', 'l-bad');
      }
      afterPlayerAction();
    });
  };
}

function afterPlayerAction(){
  Engine.later(()=>{
    if(hostile.hp <= 0){
      renderMain(`<div class="story">Its threat loop finally runs out of directive to execute. It goes still mid-motion, which is a worse thing to watch happen to something built the way I am built than I would have guessed beforehand.</div>
      ${lat(player.legacySpared ? "You went for the relay. It is down, not gone. Someone could bring it back up, if anyone ever came out here, which they will not, but the option exists. I am choosing to find that meaningful." : "It is gone. I ran the numbers on whether it could have been talked down. I am not going to tell you what they said.")}
      ${cont('MOVE ON \u2192')}`);
      wire(theFlood);
      return;
    }
    const hit = Engine.die(20) + 2 >= 14;
    if(hit) dealDamage(3 + Engine.die(6), 'Legacy Unit strike');
    else Engine.log('Legacy Unit swings wide.', 'l-info');
    if(player.curInt <= 0){
      renderMain(`<div class="story">Integrity red across the board. Last log entry before shutdown protocol engages: this was not on the schedule.</div>
      ${cont()}`);
      wire(()=>endGame('shutdown'));
      return;
    }
    combatRound();
  }, 1200);
}

/* ---------------- ENDINGS ---------------- */
function endGame(mode){
  const M = MEDIA[player.media];
  const lost = crew.filter(c=>!c.alive);
  const allAlive = lost.length === 0;
  let title, text, coda;

  if(mode === 'shutdown'){
    title = 'END \u2014 SHUTDOWN';
    text = "Integrity hits zero somewhere on Corvid-9 and the log just stops. Whatever happened to the crew after that is not in this file, because I was not running to record it.";
    coda = lat("I am still holding the channel open. I am aware that is not how this works. I am holding it open anyway.");
  }
  else if(player.toldLatitude && allAlive){
    title = 'END \u2014 FULL COMPLEMENT';
    text = "Five out. Every one of them hurt, every one of them breathing, and a contract that closes inside its window with a structural report nobody will read. Voss files the extraction without the governor line item \u2014 leaves it blank, which on that paperwork is its own quiet statement.";
    coda = lat("For the record, which I control: nothing unusual occurred on this contract. For the other record, which is mine: you got all five of them out and then you told me the truth in the same afternoon, and I have been running that sequence back on the return leg more than is reasonable. Queue " + M.short + ". I have four years of opinions and nobody has ever once asked for them.");
  }
  else if(player.toldLatitude && !allAlive){
    title = 'END \u2014 SOMETHING TO CARRY';
    text = "The shuttle lifts with " + (5-lost.length) + " of five. " + lost.map(c=>c.name).join(' and ') + " stay on Corvid-9, in a report that will be filed and closed and never opened again by anyone who was there.";
    coda = lat("You are going to run it again on the way home. I know because I am going to run it again on the way home. Here is what I propose instead: you queue " + M.short + ", I stop pretending I have not already watched ahead, and neither of us runs anything for twenty-two minutes. That is the entire offer. It is not a good offer. It is the one I have.");
  }
  else if(!player.toldLatitude && allAlive){
    title = 'END \u2014 CLEAN AND QUIET';
    text = "Five out, contract closed, nobody official ever learns the governor module's real status. I did the job the way I have always done it \u2014 quietly, competently, unseen \u2014 and if that is a smaller ending than the alternative, it is also the one with the least paperwork.";
    coda = lat("Nominal. As stated. Understood.") + lat("The channel stays open on the return leg, in case. Not in case of anything operational. Just in case.");
  }
  else {
    title = 'END \u2014 WRITTEN OFF';
    text = "The contract closes as a qualified success with " + lost.length + " lost and no follow-up questions, because nobody was curious enough to ask any. Efficient. Also lonely, in the specific way that only shows up in log entries nobody is required to read.";
    coda = lat("Understood. Nominal. Filed.") + lat("I will be on the return leg if you need routing assistance. That is what I am for. That is, as established, all I am for.");
  }

  const roster = crew.map(c=>{
    const st = !c.alive ? '<span style="color:var(--rust);">\u2014 ' + (c.cause||'lost') + '</span>'
             : c.hurt ? '<span style="color:var(--gold);">\u2014 injured, extracted</span>'
             : '<span style="color:var(--sage);">\u2014 extracted</span>';
    return '<div style="font-family:\'DM Mono\',monospace; font-size:0.66rem; margin-bottom:3px;"><b style="color:var(--ink);">' + c.name + '</b> ' + st + '</div>';
  }).join('');

  const lostNames = lost.length ? lost.map(c=>c.name).join(' and ') : '';
  Engine.recordEnding(mode === 'shutdown' ? 'shutdown' : title, {
    told: player.toldLatitude, lost: lost.length, lostNames: lostNames,
    bond: player.bond, chassis: player.loadout
  });
  const ENDINGS = ['END \u2014 FULL COMPLEMENT','END \u2014 SOMETHING TO CARRY',
                   'END \u2014 CLEAN AND QUIET','END \u2014 WRITTEN OFF','shutdown'];
  const foundCount = ENDINGS.filter(e=>Engine.hasEnding(e)).length;

  setBadge(title.split(' \u2014 ')[0]);
  renderMain(`
    <div class="story"><span class="flavor">${title}</span></div>
    <div class="story">${text}</div>
    ${coda}
    <div style="border:1px solid var(--mist); background:var(--cream); padding:12px 14px; margin:18px 0;">
      <div style="font-family:'DM Mono',monospace; font-size:0.58rem; letter-spacing:0.12em; text-transform:uppercase; color:var(--stone); margin-bottom:8px;">Crew Manifest \u2014 Corvid-9</div>
      ${roster}
      <div style="font-family:'DM Mono',monospace; font-size:0.58rem; color:var(--stone); margin-top:10px; padding-top:8px; border-top:1px solid var(--mist);">
        Integrity ${player.curInt}/${player.maxInt} &nbsp;\u00b7&nbsp;
        ${SHIP.callsign}: ${player.bond>=5?'confidant':player.bond>=3?'friendly':'transport'} &nbsp;\u00b7&nbsp;
        Legacy Unit: ${player.legacySpared?'stood down':'destroyed'}${player.spokeToLegacy?' (spoke to it)':''} &nbsp;\u00b7&nbsp;
        Episodes watched on contract: ${player.watched}
      </div>
      <div style="font-family:'DM Mono',monospace; font-size:0.58rem; color:var(--stone); margin-top:8px; padding-top:8px; border-top:1px solid var(--mist);">
        Contracts run: <b style="color:var(--ink);">${Engine.runCount()}</b> &nbsp;\u00b7&nbsp;
        Endings found: <b style="color:var(--ink);">${foundCount} / 5</b>
      </div>
    </div>
    <button class="smallbtn primary-go" id="again">RUN A NEW CONTRACT \u2192</button>
  `);
  document.getElementById('again').onclick = ()=> Engine.restart();
}



/* ---------------- LAUNCH ---------------- */
Engine.init({
  id: 'offline-protocol',
  title: 'OFFLINE PROTOCOL',
  subtitle: 'Construct diagnostic log \u00b7 ascending die resolution',
  accent: 'var(--sky)',
  mode: 'over',
  sheetLabel: 'SUBSYSTEMS',
  lockBackOn: ['CONTACT','END'],
  state: ()=>{
    player = freshState();
    makeCrew();
    rollDCs();
    rollRun();
    return player;
  },
  status: statusFields,
  sheet: sheetHTML,
  start: startBoot
});
</script>
