<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kellath's Drift — Brooks Groves</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌲</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,900;1,400;1,600&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/games/engine.css">
<link rel="stylesheet" href="/css/site-footer.css">
<script>
  (function(){
    try {
      var saved = localStorage.getItem('bg_theme');
      var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (saved === 'dark' || (!saved && dark)) document.documentElement.setAttribute('data-theme','dark');
    } catch(e) {}
  })();
</script>
</head>
<body id="top">
<div id="game"></div>

<script src="/games/engine.js"></script>
<script>
/* ---------------- PLAYER STATE ---------------- */
function freshState(){ return {
  race: null,
  stats: {}, // STR, STA, DEX, RS, INT, LOG, PER, LDR
  skill: null, // 'military' | 'technological' | 'biosocial'
  maxSTA: 0,
  curSTA: 0,
  hasGear: false
}; }
let player;

const RACES = {
  human: {
    name: "HUMAN",
    desc: "Baseline stock. No bonuses, no penalties — adaptable generalists.",
    mods: {}
  },
  dralasite: {
    name: "DRALASITE",
    desc: "Amorphous, tough. +10 STR/STA, -5 DEX/RS.",
    mods: {STR:10, STA:10, DEX:-5, RS:-5}
  },
  vrusk: {
    name: "VRUSK",
    desc: "Insectoid, methodical. +10 INT/LOG, -5 STR/STA.",
    mods: {INT:10, LOG:10, STR:-5, STA:-5}
  },
  yazirian: {
    name: "YAZIRIAN",
    desc: "Gliding, aggressive. +10 DEX/RS, -5 PER/LDR.",
    mods: {DEX:10, RS:10, PER:-5, LDR:-5}
  }
};

/* ---------------- SCENE DEFINITIONS ---------------- */
/* checkStat uses half the stat value as base target unless flagged full */
function statTarget(statName, opts){
  opts = opts || {};
  let base = player.stats[statName];
  base = opts.full ? base : Math.floor(base/2);
  let bonus = opts.skillBonus && player.skill === opts.skillBonus ? 15 : 0;
  let gearBonus = opts.gear && player.hasGear ? 10 : 0;
  const drift = (typeof RUN !== 'undefined' && RUN.drift) ? RUN.drift : 0;
  return Math.max(5, base + bonus + gearBonus + drift);
}

function statusFields(){
  if(!player || !player.race) return [['CHARACTER','\u2014'],['STAMINA','\u2014'],['SPEC','\u2014']];
  const cls = player.curSTA <= player.maxSTA*0.3 ? 'sta-low' : 'sta-val';
  return [
    ['CHARACTER', RACES[player.race].name],
    ['STAMINA', player.curSTA + ' / ' + player.maxSTA, cls],
    ['SPEC', player.skill ? player.skill.toUpperCase() : '\u2014']
  ];
}


/* ---------------- CHARGEN FLOW ---------------- */
function startChargen(){
  Engine.badge('CHARGEN');
  Engine.render(`
    <div class="story">Escape pod telemetry reads static. You are the sole scout aboard a survey skiff that just went down hard on <span class="flavor">Kellath's Drift</span>, an uncharted moon on the frontier edge. Before you build a body to survive it — choose your stock.</div>
    <div class="raceGrid" id="raceGrid"></div>
    <button class="smallbtn primary-go" id="raceNext" disabled>CONFIRM STOCK →</button>
  `);
  const grid = document.getElementById('raceGrid');
  Object.keys(RACES).forEach(key=>{
    const r = RACES[key];
    const card = document.createElement('div');
    card.className = 'raceCard';
    card.innerHTML = `<div class="rname">${r.name}</div><div class="rdesc">${r.desc}</div>`;
    card.onclick = ()=>{
      document.querySelectorAll('.raceCard').forEach(c=>c.classList.remove('selected'));
      card.classList.add('selected');
      player.race = key;
      document.getElementById('raceNext').disabled = false;
    };
    grid.appendChild(card);
  });
  document.getElementById('raceNext').onclick = ()=>Engine.go(rollStats);
}

function rollStats(){
  const mods = RACES[player.race].mods || {};
  const pairs = [['STR','STA'],['DEX','RS'],['INT','LOG'],['PER','LDR']];
  pairs.forEach(pair=>{
    let base = 30 + Engine.d10()*4 + Engine.d10(); // ~30-69 spread
    pair.forEach(stat=>{
      player.stats[stat] = Math.min(90, Math.max(15, base + (mods[stat]||0)));
    });
  });
  showStats();
}

function showStats(){
  Engine.badge('CHARGEN');
  Engine.log('Ability scores generated for ' + RACES[player.race].name + '.', 'l-info');
  const pairs = [['STR','STA'],['DEX','RS'],['INT','LOG'],['PER','LDR']];
  let gridHtml = '';
  pairs.forEach(pair=>{
    pair.forEach(stat=>{
      gridHtml += `<div class="statPair"><div class="pname">${statFull(stat)}</div><div class="pval">${player.stats[stat]}</div></div>`;
    });
  });
  Engine.render(`
    <div class="story">Your physiology resolves. These numbers are your baseline capability out of 100.</div>
    <div class="gridPairs">${gridHtml}</div>
    <button class="smallbtn" id="reroll">REROLL</button>
    <button class="smallbtn primary-go" id="toSkill">CONFIRM →</button>
  `);
  document.getElementById('reroll').onclick = rollStats;
  document.getElementById('toSkill').onclick = ()=>Engine.go(chooseSkill);
}

function statFull(s){
  const map = {STR:'STRENGTH',STA:'STAMINA',DEX:'DEXTERITY',RS:'REACTION SPD',INT:'INTUITION',LOG:'LOGIC',PER:'PERSONALITY',LDR:'LEADERSHIP'};
  return map[s];
}

function chooseSkill(){
  Engine.badge('CHARGEN');
  Engine.render(`
    <div class="story">One area of training runs deeper than the rest. Pick your Primary Skill Area — it grants +15 to checks in its wheelhouse.</div>
    <div class="choices">
      <button class="choice" data-s="military"><span class="tag">MILITARY</span>Weapons, combat instinct, close-quarters survival.</button>
      <button class="choice" data-s="technological"><span class="tag">TECHNOLOGICAL</span>Repair, computers, engineering, technical reasoning.</button>
      <button class="choice" data-s="biosocial"><span class="tag">BIOSOCIAL</span>Medicine, negotiation, reading people and creatures.</button>
    </div>
  `);
  document.querySelectorAll('#main .choice').forEach(b=>{
    b.onclick = ()=>{
      player.skill = b.dataset.s;
      player.maxSTA = player.stats.STA;
      player.curSTA = player.maxSTA;
      Engine.refreshStatus();
      Engine.log('Specialization locked: ' + player.skill.toUpperCase() + '.', 'l-info');
      Engine.render(`<div class="story">Character sealed. ${RACES[player.race].name}, STA ${player.maxSTA}, trained in ${player.skill}.<br><br>The skiff's hull ticks as it cools. Somewhere on this moon, a working relay tower is your only way home.</div>
      <button class="smallbtn primary-go" id="begin">BEGIN DESCENT →</button>`);
      document.getElementById('begin').onclick = ()=>Engine.go(scene1);
    };
  });
}

/* ---------------- RUN VARIATION ---------------- */
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
let RUN = {};
function rollRun(){
  RUN = {
    // per-run difficulty drift, applied inside statTarget
    drift: Math.floor(Math.random()*7) - 3,
    salvage: pick([
      {name:"a stun-charge sidearm and a coil of climbing line", short:"stun-charge sidearm"},
      {name:"a cutting torch with three-quarters of a cell left and a length of cargo strap", short:"cutting torch"},
      {name:"a shock-baton and a spool of monofilament cable", short:"shock-baton"}
    ]),
    chasm: pick([
      {span:"a rusted service line", cross:"hand-over-hand", detail:"groaning in the wind"},
      {span:"a collapsed conveyor gantry", cross:"along the spine", detail:"canted twenty degrees and shedding flakes of rust"},
      {span:"a half-buried pipeline run", cross:"straddling the pipe", detail:"venting something cold from a seam near the middle"}
    ]),
    beast: pick([
      {name:"ravik", desc:"a low, six-limbed shape with a plated head, tasting the air with a forked tongue", hp:28},
      {name:"kessin", desc:"something long and segmented, half-coiled in the shade of a rock shelf, sensing by vibration", hp:31},
      {name:"drell", desc:"a hunched quadruped with mineral growth crusting its back, grazing on lichen and territorial about it", hp:25}
    ]),
    tower: pick([
      "half its housing sheared open by weather",
      "guy-wires snapped on the windward side, leaning into its own shadow",
      "its dish collapsed inward like a dropped bowl"
    ])
  };
}
rollRun();

function tgt(statName, opts){
  return Engine.odds({target: statTarget(statName, opts)});
}

/* ---------------- CHARACTER SHEET ---------------- */
function sheetHTML(){
  if(!player || !player.race) return '';
  const order = ['STR','STA','DEX','RS','INT','LOG','PER','LDR'];
  let grid = '';
  order.forEach(s=>{
    const v = player.stats[s];
    grid += '<div class="sheetStat"><div class="sn">' + statFull(s) + '</div>' +
            '<div class="sv">' + v + '</div>' +
            '<div class="sh">half: ' + Math.floor(v/2) + '</div></div>';
  });
  return '<div class="sheetGrid">' + grid + '</div>' +
    '<div class="sheetMeta">' +
      'Stock: <b>' + RACES[player.race].name + '</b> &nbsp;\u00b7&nbsp; ' +
      'Specialization: <b>' + (player.skill ? player.skill.toUpperCase() : '\u2014') + '</b> (+15 in area)<br>' +
      'Gear: <b>' + (player.hasGear ? RUN.salvage.name + ' (+10 where useful)' : 'none recovered') + '</b><br>' +
      'Run drift: <b>' + (RUN.drift>=0?'+':'') + RUN.drift + '</b> applied to every target<br>' +
      'Stamina: <b>' + player.curSTA + ' / ' + player.maxSTA + '</b>' +
    '</div>';
}

/* ---------------- STORY SCENES ---------------- */
function scene1(){
  Engine.badge('SCENE 1');
  Engine.render(`
    <div class="story">The skiff is a smoking wedge in red scrub. Your suit display shows a relay tower blinking eleven kilometers north across broken canyon country. Life support has maybe two days left in it.</div>
    <div class="choices">
      <button class="choice" id="c1a"><span class="tag">SEARCH THE WRECK</span>Dig through the crushed cargo bay for anything useful before you go. (LOGIC check)${tgt('LOG',{skillBonus:'technological'})}</button>
      <button class="choice" id="c1b"><span class="tag">MOVE OUT NOW</span>Don't waste time. Head straight for the ridge line.</button>
    </div>
  `);
  document.getElementById('c1a').onclick = ()=>{
    const target = statTarget('LOG', {skillBonus:'technological'});
    Engine.check({target:target, label:'Search wreckage (LOGIC)'}, (success)=>{
      if(success){
        player.hasGear = true;
        Engine.render(`<div class="story">Under a buckled panel you find ${RUN.salvage.name}, still functional. <span class="flavor">(+10 to future checks where gear helps.)</span></div>
        <button class="smallbtn primary-go" id="n">CONTINUE →</button>`);
      } else {
        Engine.render(`<div class="story">The cargo bay is slag. Ten minutes lost for nothing but a scorched glove.</div>
        <button class="smallbtn primary-go" id="n">CONTINUE →</button>`);
      }
      document.getElementById('n').onclick = ()=>Engine.go(scene2);
    });
  };
  document.getElementById('c1b').onclick = ()=>Engine.go(scene2);
}

function scene2(){
  Engine.badge('SCENE 2');
  Engine.render(`
    <div class="story">A chasm splits the trail — sixty meters down to jagged rock. ${RUN.chasm.span.charAt(0).toUpperCase() + RUN.chasm.span.slice(1)} spans it, ${RUN.chasm.detail}.</div>
    <div class="choices">
      <button class="choice" id="c2a"><span class="tag">CROSS IT</span>Fast but risky. (REACTION SPEED check)${tgt('RS',{gear:true})}</button>
      <button class="choice" id="c2b"><span class="tag">CLIMB DOWN AND AROUND</span>Slower, safer, costs you daylight. (STRENGTH check, lower stakes)${tgt('STR',{full:true})}</button>
    </div>
  `);
  document.getElementById('c2a').onclick = ()=>{
    const target = statTarget('RS', {gear:true});
    Engine.check({target:target, label:'Cross the line (REACTION SPEED)'}, (success)=>{
      if(!success){
        const dmg = 5 + Engine.d10();
        player.curSTA -= dmg;
        Engine.sfxHurt();
        Engine.refreshStatus();
        Engine.log('Fall damage: -' + dmg + ' STA', 'l-bad');
        Engine.render(`<div class="story">Your foot skids. You catch ${RUN.chasm.span} hard, wrenching your side against it — <span class="flavor">-${dmg} STA.</span></div>
        <button class="smallbtn primary-go" id="n">CONTINUE →</button>`);
      } else {
        Engine.render(`<div class="story">You cross ${RUN.chasm.cross} in under a minute, boots finding every solid purchase.</div>
        <button class="smallbtn primary-go" id="n">CONTINUE →</button>`);
      }
      document.getElementById('n').onclick = ()=>Engine.go(scene3);
    });
  };
  document.getElementById('c2b').onclick = ()=>{
    const target = statTarget('STR', {full:true});
    Engine.check({target:target, label:'Climb route (STRENGTH)'}, (success)=>{
      if(!success){
        const dmg = 3 + Engine.d10();
        player.curSTA -= dmg;
        Engine.sfxHurt();
        Engine.refreshStatus();
        Engine.log('Scramble mishap: -' + dmg + ' STA', 'l-bad');
        Engine.render(`<div class="story">The descent is rougher than it looked. You slide the last few meters — <span class="flavor">-${dmg} STA.</span></div>
        <button class="smallbtn primary-go" id="n">CONTINUE →</button>`);
      } else {
        Engine.render(`<div class="story">Slow going, but you make the far rim without a scratch. The sun's lower now.</div>
        <button class="smallbtn primary-go" id="n">CONTINUE →</button>`);
      }
      document.getElementById('n').onclick = ()=>Engine.go(scene3);
    });
  };
}

function scene3(){
  Engine.badge('SCENE 3');
  Engine.render(`
    <div class="story">Something big shifts in the red scrub ahead — ${RUN.beast.desc}. A <span class="flavor">${RUN.beast.name}</span>, territorial and fast. It hasn't spotted you yet.</div>
    <div class="choices">
      <button class="choice" id="c3a"><span class="tag">STAY LOW, SLIP PAST</span>Move quiet through the scrub. (REACTION SPEED check)${tgt('RS',{})}</button>
      <button class="choice" id="c3b"><span class="tag">STAND AND FIGHT</span>Draw whatever you have and engage.</button>
    </div>
  `);
  document.getElementById('c3a').onclick = ()=>{
    const target = statTarget('RS', {});
    Engine.check({target:target, label:'Stealth (REACTION SPEED)'}, (success)=>{
      if(success){
        Engine.render(`<div class="story">You thread between the rocks. The ${RUN.beast.name}'s head swings toward a lizard skittering the other way, and you're past.</div>
        <button class="smallbtn primary-go" id="n">CONTINUE →</button>`);
        document.getElementById('n').onclick = ()=>Engine.go(scene4);
      } else {
        Engine.log('Stealth failed — the ' + RUN.beast.name + ' has your scent.', 'l-bad');
        Engine.render(`<div class="story">A branch snaps under your boot. The ${RUN.beast.name}'s head snaps around and it charges.</div>
        <button class="smallbtn primary-go" id="n">BRACE FOR IMPACT →</button>`);
        document.getElementById('n').onclick = ()=>Engine.go(startCombat);
      }
    });
  };
  document.getElementById('c3b').onclick = ()=>Engine.go(startCombat);
}

/* ---------------- COMBAT ---------------- */
let creature = {name:'RAVIK', hp:28, maxHp:28};

function startCombat(){
  Engine.badge('COMBAT');
  creature = {name:RUN.beast.name.toUpperCase(), hp:RUN.beast.hp, maxHp:RUN.beast.hp};
  Engine.render(`<div class="story">The ${RUN.beast.name} closes fast, claws scraping rock. <span class="flavor">Combat begins.</span></div>
  <div id="combatBody"></div>`);
  combatRound();
}

function combatRound(){
  if(player.curSTA <= 0){ return Engine.go(()=>endGame(false, 'wounded')); }
  if(creature.hp <= 0){ return Engine.go(scene4); }
  Engine.clearRolls();
  document.getElementById('combatBody').innerHTML = `
    <div class="gridPairs">
      <div class="statPair"><div class="pname">${creature.name} HP</div><div class="pval">${creature.hp} / ${creature.maxHp}</div></div>
      <div class="statPair"><div class="pname">YOUR STA</div><div class="pval">${player.curSTA} / ${player.maxSTA}</div></div>
    </div>
    <div class="choices">
      <button class="choice" id="atk"><span class="tag">ATTACK</span>${player.hasGear ? 'Bring up the ' + RUN.salvage.short + '.' : 'Swing whatever you can grab.'} (DEXTERITY check)${tgt('DEX',{skillBonus:'military',gear:true})}</button>
    </div>
  `;
  document.getElementById('atk').onclick = ()=>{
    const target = statTarget('DEX', {skillBonus:'military', gear:true});
    Engine.check({target:target, label:'Attack roll (DEXTERITY)'}, (success)=>{
      if(success){
        const dmg = 6 + Engine.d10() + (player.hasGear?4:0);
        creature.hp -= dmg;
        Engine.log('You hit the ' + RUN.beast.name + ' for ' + dmg + ' damage.', 'l-good');
        afterPlayerAction();
      } else {
        Engine.log('Your attack goes wide.', 'l-bad');
        afterPlayerAction();
      }
    });
  };
}

function afterPlayerAction(){
  Engine.later(()=>{
    if(creature.hp <= 0){
      Engine.render(`<div class="story">The ${RUN.beast.name} shudders, buckles, and stops moving, cracking against the stone — dead still.</div>
      <button class="smallbtn primary-go" id="n">MOVE ON →</button>`);
      document.getElementById('n').onclick = ()=>Engine.go(scene4);
      return;
    }
    // creature attacks back
    const creatureTarget = 45;
    const r = Engine.percentile();
    const hit = r.value <= creatureTarget;
    if(hit){
      const dmg = 4 + Engine.d10();
      player.curSTA -= dmg;
      Engine.sfxHurt();
      Engine.refreshStatus();
      Engine.log('The ' + RUN.beast.name + ' claws you for ' + dmg + ' damage.', 'l-bad');
    } else {
      Engine.log('The ' + RUN.beast.name + ' lunges and misses.', 'l-info');
    }
    if(player.curSTA <= 0){
      Engine.render(`<div class="story">Your legs give out. The last thing you see is the ${RUN.beast.name}'s shadow falling over you...</div>
      <button class="smallbtn primary-go" id="n">CONTINUE →</button>`);
      document.getElementById('n').onclick = ()=>Engine.go(()=>endGame(false,'wounded'));
      return;
    }
    combatRound();
  }, 1200);
}

/* ---------------- FINAL SCENE ---------------- */
function scene4(){
  Engine.badge('SCENE 4');
  Engine.render(`
    <div class="story">The relay tower leans against the sky, ${RUN.tower}. Its console still flickers with a thread of power — enough for one clean transmission, if you can route it correctly.</div>
    <div class="choices">
      <button class="choice" id="c4a"><span class="tag">RE-ROUTE THE CONSOLE</span>Careful, methodical repair work. (LOGIC check)${tgt('LOG',{skillBonus:'technological',gear:true})}</button>
      <button class="choice" id="c4b"><span class="tag">FORCE A RAW BROADCAST</span>Skip the repair, blast an unrouted signal and hope something hears it. (LEADERSHIP check, harder)${tgt('LDR',{skillBonus:'biosocial'})}</button>
    </div>
  `);
  document.getElementById('c4a').onclick = ()=>{
    const target = statTarget('LOG', {skillBonus:'technological', gear:true});
    Engine.check({target:target, label:'Re-route console (second attempt)'}, (success)=>{
      if(success) Engine.go(()=>endGame(true, 'clean'));
      else {
        Engine.render(`<div class="story">The panel sparks and the thread of power gutters. One more try, if you're steady enough.</div>
        <button class="smallbtn primary-go" id="retry">TRY AGAIN →</button>`);
        document.getElementById('retry').onclick = ()=>{
          const t2 = statTarget('LOG', {skillBonus:'technological', gear:true}) - 10;
          Engine.check({target:t2, label:'Re-route console (LOGIC)'}, (s2)=>{ Engine.go(()=>endGame(s2, s2 ? 'clean':'wounded')); });
        };
      }
    });
  };
  document.getElementById('c4b').onclick = ()=>{
    const target = statTarget('LDR', {skillBonus:'biosocial'});
    Engine.check({target:target, label:'Force broadcast (LEADERSHIP)'}, (success)=>{ Engine.go(()=>endGame(success, success ? 'raw':'wounded')); });
  };
}

function endGame(won, mode){
  Engine.recordEnding(won ? ('rescued-'+mode) : ('lost-'+mode), {won:won, mode:mode, sta:player.curSTA});
  Engine.badge(won ? 'RESCUED' : 'MISSION LOST');
  let text;
  if(won && mode==='clean'){
    text = "The console locks onto a carrier band and holds. Somewhere in orbit, a relay satellite catches your signal and forwards it home. Twelve hours later, a rescue skiff's running lights cut through the dark. You made it — and in one piece.";
  } else if(won && mode==='raw'){
    text = "The raw broadcast is ugly, half-garbled — but it's enough. A passing salvage crew picks up the fragment three days later and backtracks your position. Rescue is slower and rougher than you'd like, but it comes.";
  } else if(!won && mode==='clean'){
    text = "The signal goes out thin and unrouted. Somewhere, someone might be listening. You wrap your jacket tighter, ration what's left, and wait to find out.";
  } else {
    text = "You're alive, but barely — STA critical, the tower's thread of power fading. You seal what you can and hunker down against the ridge, betting your beacon caught someone's attention before everything went dark.";
  }
  Engine.render(`<div class="story">${text}</div>
  <button class="smallbtn primary-go" id="again">RUN A NEW SCOUT →</button>`);
  document.getElementById('again').onclick = ()=> Engine.restart();
}


/* ---------------- LAUNCH ---------------- */
Engine.init({
  id: 'kellaths-drift',
  title: "SIGNAL: KELLATH'S DRIFT",
  subtitle: 'Frontier scout protocol \u00b7 percentile resolution',
  accent: 'var(--gold)',
  mode: 'under',
  sheetLabel: 'CHARACTER SHEET',
  lockBackOn: ['COMBAT','RESCUED','MISSION'],
  state: ()=>{
    player = freshState();
    rollRun();
    return player;
  },
  status: statusFields,
  sheet: sheetHTML,
  start: startChargen
});
</script>


</body>
</html>
